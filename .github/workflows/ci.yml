name: CI

on:
  push:
    branches: [ main, dlss-ue4ss, nr-prescale, nr-depth-inverted-type, drop-reshade, viewrectmin-tripwire2, main-integration, dlss-fg, engine-seam-l1, seam-l1-crash, view-cb-identity, drop-pass-finder, shadow-slot-read-bit, shadow-skip-graphics-heaps, colour-input-identity, fix-render-rect, fix-letterbox-continuity, drop-dead-describe-view, drop-fg-throttle-report, shadow-graphics-heaps-off, perf-resolve-split, perf-fg-bucket, perf-skip-unannounced, view-cb-cached-params, view-cb-cached-params-l2, u0-rhi-uav, rr-reflection-denoise, rr-guides-pool-names, dlss-tweak-ui ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, dlss-ue4ss, nr-prescale, nr-depth-inverted-type, drop-reshade, viewrectmin-tripwire2, main-integration, dlss-fg, engine-seam-l1, seam-l1-crash, view-cb-identity, drop-pass-finder, shadow-slot-read-bit, shadow-skip-graphics-heaps, colour-input-identity, fix-render-rect, fix-letterbox-continuity, drop-dead-describe-view, drop-fg-throttle-report, shadow-graphics-heaps-off, perf-resolve-split, perf-fg-bucket, perf-skip-unannounced, view-cb-cached-params, view-cb-cached-params-l2, u0-rhi-uav, rr-reflection-denoise, rr-guides-pool-names, dlss-tweak-ui ]
  workflow_dispatch:

env:
  # Version-pinned so a silent upstream bump cannot change what we link against.
  # See docs/RESEARCH.md §3 for why each pin is load-bearing.
  DLSS_SDK_TAG: v310.7.0

jobs:
  # The pure-logic tests carry every convention that could silently produce a wrong image,
  # so they run first and fast. If these fail, nothing else is worth building.
  tests-linux:
    name: Unit tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache FetchContent sources
        uses: actions/cache@v6
        with:
          path: |
            build/_deps/doctest-src
            build/_deps/doctest-subbuild
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DSTRAY_DLSS_BUILD_TESTS=ON
          -DFETCHCONTENT_UPDATES_DISCONNECTED=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-windows:
    name: Native + WARP (Windows, MSVC, NGX=${{ matrix.ngx }})
    runs-on: windows-latest
    needs: tests-linux
    env:
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        # NGX ON is the real add-on. NGX OFF is an otherwise identical diagnostic build used
        # to isolate DLL-load failures: linking NVIDIA's static NGX library runs its global
        # constructors at DLL entry, before our DllMain body, and a fault there surfaces as
        # LoadLibraryEx error 998 with none of our code having run.
        ngx: [ON, OFF]
    steps:
      - uses: actions/checkout@v4

      - name: Add MSVC to PATH
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Same tool and pin as dlss-plugin.yml's plugin job. sccache caches every cl.exe
      # invocation through the GHA cache backend, content-addressed — the ON/OFF matrix legs
      # compile different preprocessed output (STRAY_DLSS_ENABLE_NGX differs) so they land in
      # different cache entries automatically, with no per-leg key needed. Requires the /Z7
      # (not /Zi) debug-info format set on every target above, so /Fd is never shared between
      # objects of one target.
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      # The NGX import library is ~5 MB, so it is fetched rather than committed. The DLSS
      # SDK's redistribution terms also make fetching the cleaner posture than vendoring.
      - name: Fetch NGX import library
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path third_party/ngx/lib | Out-Null
          # _s = static CRT, matching the /MT build. See CMakeLists for why /MT is mandatory.
          $url = "https://github.com/NVIDIA/DLSS/raw/$env:DLSS_SDK_TAG/lib/Windows_x86_64/x64/nvsdk_ngx_s.lib"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile third_party/ngx/lib/nvsdk_ngx_s.lib
          $size = (Get-Item third_party/ngx/lib/nvsdk_ngx_s.lib).Length
          Write-Host "nvsdk_ngx_s.lib = $size bytes"
          if ($size -lt 1000000) { throw "nvsdk_ngx_s.lib looks truncated ($size bytes)" }

      # Same class as tests-linux's cache: doctest is CMakeLists.txt's only FetchContent dep,
      # public source pinned by GIT_TAG in that file. Keyed on its hash, per-OS because the
      # subbuild directory embeds a generator-specific project.
      - name: Cache FetchContent sources
        uses: actions/cache@v6
        with:
          path: |
            build/_deps/doctest-src
            build/_deps/doctest-subbuild
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      # CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded turns any CMake-injected debug-format
      # flag into /Z7 too, belt and braces alongside the per-target /Z7 already set in
      # CMakeLists.txt. FETCHCONTENT_UPDATES_DISCONNECTED skips the per-dep update check when
      # the FetchContent cache above restores: the pin cannot have moved without the key
      # (CMakeLists.txt's hash) changing too.
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DSTRAY_DLSS_BUILD_TESTS=ON `
            -DSTRAY_DLSS_ENABLE_NGX=${{ matrix.ngx }} `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded `
            -DFETCHCONTENT_UPDATES_DISCONNECTED=ON

      - name: Build
        shell: pwsh
        run: |
          sccache --zero-stats | Out-Null
          cmake --build build --parallel
          if ($LASTEXITCODE -ne 0) { throw "build failed ($LASTEXITCODE)" }

      # Read this to know whether the cache did anything: "Cache hits" against "Cache misses".
      # Zero compile requests means the launcher never engaged, which is a fault in the
      # caching, so it fails the job rather than silently building uncached every run.
      - name: sccache stats
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stats = & sccache --show-stats | Out-String
          Write-Host $stats
          $m = [regex]::Match($stats, 'Compile requests\s+(\d+)')
          if (-not $m.Success) { throw "sccache --show-stats printed no 'Compile requests' line" }
          if ([int]$m.Groups[1].Value -eq 0) { throw "sccache saw zero compile requests: the compiler launcher never engaged" }

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # WARP is Microsoft's software D3D12 device, so this runs on a GPU-less runner. It
      # judges our own D3D12 usage with the debug layer, which the target machine cannot do:
      # vkd3d-proton in a release build validates root parameters by assert only, so illegal
      # usage there is silent and shows up as a wrong image or an unresponsive GPU.
      - name: WARP harness (NGX=ON only)
        if: matrix.ngx == 'ON'
        shell: pwsh
        run: |
          $exe = "build/stray_dlss_warp.exe"
          if (-not (Test-Path $exe)) { throw "WARP harness was not built" }
          & $exe
          if ($LASTEXITCODE -ne 0) { throw "WARP harness reported failures" }


      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $suffix = if ("${{ matrix.ngx }}" -eq "ON") { "" } else { "-nongx" }
          Copy-Item README.md dist/
          Copy-Item docs/STRAY-RENDERING-FACTS.md dist/
          # Ship the harness too. CI runs it against WARP; the same binary is run against
          # the real GPU under Proton on the target box via tools/run-harness-proton.sh,
          # which is the only way to exercise vkd3d-proton rather than WARP's model of it.
          if (Test-Path build/stray_dlss_warp.exe) {
            Copy-Item build/stray_dlss_warp.exe "dist/stray-dlss-harness$suffix.exe"
          }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: stray-dlss-harness-ngx-${{ matrix.ngx }}
          path: dist/
          if-no-files-found: error
