name: CI

on:
  push:
    branches: [ main, dlss-ue4ss, dlss-fg, engine-seam-l1, seam-l1-crash, view-cb-identity, drop-pass-finder, shadow-slot-read-bit, shadow-skip-graphics-heaps, colour-input-identity, fix-render-rect, fix-letterbox-continuity, drop-dead-describe-view, drop-fg-throttle-report, shadow-graphics-heaps-off ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, dlss-ue4ss, dlss-fg, engine-seam-l1, seam-l1-crash, view-cb-identity, drop-pass-finder, shadow-slot-read-bit, shadow-skip-graphics-heaps, colour-input-identity, fix-render-rect, fix-letterbox-continuity, drop-dead-describe-view, drop-fg-throttle-report, shadow-graphics-heaps-off ]
  workflow_dispatch:

env:
  # Version-pinned so a silent upstream bump cannot change what we link against.
  # See docs/RESEARCH.md §3 for why each pin is load-bearing.
  DLSS_SDK_TAG: v310.7.0

jobs:
  # The pure-logic tests carry every convention that could silently produce a wrong image,
  # so they run first and fast. If these fail, nothing else is worth building.
  tests-linux:
    name: Unit tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The interception seam (plan Stage 1): ReShade's headers are allowed in exactly one
      # directory. Anything else that includes them is coupled to the framework and cannot be
      # shared with the native backend.
      - name: No ReShade include outside the ReShade backend
        run: |
          set -e
          bad=$(grep -rln --include='*.cpp' --include='*.hpp' -E '#include *[<"](reshade|imgui|reshade_all|descriptor_tracking|state_tracking)' src | grep -v '^src/backend_reshade/' || true)
          if [ -n "$bad" ]; then echo "ReShade leaked outside src/backend_reshade/:"; echo "$bad"; exit 1; fi
          echo "clean"

      # doctest is the only FetchContent dep this job pulls (CMakeLists.txt's
      # STRAY_DLSS_BUILD_TESTS block). It is public source, pinned by GIT_TAG in that same
      # file, so the key is the file's hash: a changed pin (or a changed URL) is a cache miss
      # by construction, never a stale clone.
      - name: Cache FetchContent sources
        uses: actions/cache@v6
        with:
          path: |
            build/_deps/doctest-src
            build/_deps/doctest-subbuild
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DSTRAY_DLSS_BUILD_ADDON=OFF
          -DSTRAY_DLSS_BUILD_TESTS=ON
          -DFETCHCONTENT_UPDATES_DISCONNECTED=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-windows:
    name: Add-on (Windows, MSVC, NGX=${{ matrix.ngx }})
    runs-on: windows-latest
    needs: tests-linux
    env:
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        # NGX ON is the real add-on. NGX OFF is an otherwise identical diagnostic build used
        # to isolate DLL-load failures: linking NVIDIA's static NGX library runs its global
        # constructors at DLL entry, before our DllMain body, and a fault there surfaces as
        # LoadLibraryEx error 998 with none of our code having run.
        ngx: [ON, OFF]
    steps:
      - uses: actions/checkout@v4

      - name: Add MSVC to PATH
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Same tool and pin as dlss-plugin.yml's plugin job. sccache caches every cl.exe
      # invocation through the GHA cache backend, content-addressed — the ON/OFF matrix legs
      # compile different preprocessed output (STRAY_DLSS_ENABLE_NGX differs) so they land in
      # different cache entries automatically, with no per-leg key needed. Requires the /Z7
      # (not /Zi) debug-info format set on every target above, so /Fd is never shared between
      # objects of one target.
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      # The NGX import library is ~5 MB, so it is fetched rather than committed. The DLSS
      # SDK's redistribution terms also make fetching the cleaner posture than vendoring.
      - name: Fetch NGX import library
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path third_party/ngx/lib | Out-Null
          # _s = static CRT, matching the /MT build. See CMakeLists for why /MT is mandatory.
          $url = "https://github.com/NVIDIA/DLSS/raw/$env:DLSS_SDK_TAG/lib/Windows_x86_64/x64/nvsdk_ngx_s.lib"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile third_party/ngx/lib/nvsdk_ngx_s.lib
          $size = (Get-Item third_party/ngx/lib/nvsdk_ngx_s.lib).Length
          Write-Host "nvsdk_ngx_s.lib = $size bytes"
          if ($size -lt 1000000) { throw "nvsdk_ngx_s.lib looks truncated ($size bytes)" }

      # Same class as tests-linux's cache: doctest is CMakeLists.txt's only FetchContent dep,
      # public source pinned by GIT_TAG in that file. Keyed on its hash, per-OS because the
      # subbuild directory embeds a generator-specific project.
      - name: Cache FetchContent sources
        uses: actions/cache@v6
        with:
          path: |
            build/_deps/doctest-src
            build/_deps/doctest-subbuild
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      # CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded turns any CMake-injected debug-format
      # flag into /Z7 too, belt and braces alongside the per-target /Z7 already set in
      # CMakeLists.txt. FETCHCONTENT_UPDATES_DISCONNECTED skips the per-dep update check when
      # the FetchContent cache above restores: the pin cannot have moved without the key
      # (CMakeLists.txt's hash) changing too.
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DSTRAY_DLSS_BUILD_ADDON=ON `
            -DSTRAY_DLSS_BUILD_TESTS=ON `
            -DSTRAY_DLSS_ENABLE_NGX=${{ matrix.ngx }} `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded `
            -DFETCHCONTENT_UPDATES_DISCONNECTED=ON

      - name: Build
        shell: pwsh
        run: |
          sccache --zero-stats | Out-Null
          cmake --build build --parallel
          if ($LASTEXITCODE -ne 0) { throw "build failed ($LASTEXITCODE)" }

      # Read this to know whether the cache did anything: "Cache hits" against "Cache misses".
      # Zero compile requests means the launcher never engaged, which is a fault in the
      # caching, so it fails the job rather than silently building uncached every run.
      - name: sccache stats
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stats = & sccache --show-stats | Out-String
          Write-Host $stats
          $m = [regex]::Match($stats, 'Compile requests\s+(\d+)')
          if (-not $m.Success) { throw "sccache --show-stats printed no 'Compile requests' line" }
          if ([int]$m.Groups[1].Value -eq 0) { throw "sccache saw zero compile requests: the compiler launcher never engaged" }

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # WARP is Microsoft's software D3D12 device, so this runs on a GPU-less runner. It
      # judges our own D3D12 usage with the debug layer, which the target machine cannot do:
      # vkd3d-proton in a release build validates root parameters by assert only, so illegal
      # usage there is silent and shows up as a wrong image or an unresponsive GPU.
      - name: WARP harness (NGX=ON only)
        if: matrix.ngx == 'ON'
        shell: pwsh
        run: |
          $exe = "build/stray_dlss_warp.exe"
          if (-not (Test-Path $exe)) { throw "WARP harness was not built" }
          & $exe
          if ($LASTEXITCODE -ne 0) { throw "WARP harness reported failures" }

      # A .addon64 that does not export what ReShade looks for loads and then does nothing,
      # with no error anyone can see. Check it here instead of discovering it in the game.
      # ------------------------------------------------------------------------------------
      # Real-ReShade lane.
      #
      # ReShade attaches its add-on path inside the hooked D3D12CreateDevice
      # (source/d3d12/d3d12.cpp:40 in v6.8.0), NOT at swapchain creation or Present -- and it
      # refuses WARP only in its D3D10/D3D11 paths (d3d10.cpp:159, d3d11.cpp:150), never in
      # source/d3d12/. So a headless console app with no window and no swapchain is enough to
      # load the real ReShade and the real add-on.
      #
      # Dropping ReShade in as d3d12.dll means the harness's own D3D12CreateDevice returns
      # ReShade's proxy, so every existing test then runs against its real device and
      # command-list wrappers -- its descriptor-heap proxies and handle conversion, the code
      # CLAUDE.md flags as having no release-build validation. That environment is otherwise
      # unreachable without the game.
      # The installer is ~4 MB and the URL below hardcodes the version (6.8.0), so the key
      # can just be that filename: bumping the pinned ReShade version changes the URL and
      # therefore the key, which is a clean miss rather than a stale download.
      - name: Cache ReShade installer
        if: matrix.ngx == 'OFF'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/reshade-installer
          key: reshade-installer-ReShade_Setup_6.8.0_Addon.exe-v1

      - name: Real ReShade lane (NGX=OFF only)
        if: matrix.ngx == 'OFF'
        shell: pwsh
        working-directory: build
        run: |
          # The shipped installer, not a self-built ReShade: the point is to test the binary
          # the user actually runs. Its DLLs are embedded .NET resources.
          $cacheDir = "${{ runner.temp }}/reshade-installer"
          $cached = Join-Path $cacheDir "ReShade_Setup_6.8.0_Addon.exe"
          if (Test-Path $cached) {
            Write-Host "Using cached installer: $cached"
            Copy-Item $cached setup.exe
          } else {
            Invoke-WebRequest -Uri "https://reshade.me/downloads/ReShade_Setup_6.8.0_Addon.exe" `
                              -OutFile setup.exe -UseBasicParsing
            New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
            Copy-Item setup.exe $cached
          }
          python ../tools/extract_reshade.py setup.exe d3d12.dll
          if (-not (Test-Path d3d12.dll)) { throw "failed to extract ReShade64.dll" }
          Write-Host "ReShade version: $((Get-Item d3d12.dll).VersionInfo.FileVersion)"

          Copy-Item stray-dlss.addon64 . -ErrorAction SilentlyContinue
          # Written as an array, not a here-string: a here-string's lines would sit at column 0
          # and terminate this YAML block scalar.
          Set-Content ReShade.ini @('[GENERAL]', 'AddonPath=.', '[ADDON]', 'AddonPath=.')

          # A hang here is a ReShade assert dialog, so bound it rather than waiting for the
          # job timeout.
          $p = Start-Process -FilePath .\stray_dlss_warp.exe -ArgumentList '--expect-reshade' `
                             -NoNewWindow -PassThru `
                             -RedirectStandardOutput harness-reshade.txt `
                             -RedirectStandardError harness-reshade.err
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "harness hung under ReShade (assert dialog?)" }
          Get-Content harness-reshade.txt
          if (Test-Path harness-reshade.err) { Get-Content harness-reshade.err }

          if (Test-Path ReShade.log) {
            Write-Host "--- ReShade.log (add-on lines) ---"
            Select-String -Path ReShade.log -Pattern 'add-on|addon' | Select-Object -First 20 | ForEach-Object { $_.Line }
          } else { throw "ReShade.log was not written - ReShade did not initialise" }

          if (-not (Test-Path stray-dlss.log)) { throw "the add-on never ran: stray-dlss.log is absent" }
          Write-Host "--- stray-dlss.log ---"
          Get-Content stray-dlss.log | Select-Object -First 30

          if (-not (Select-String -Path stray-dlss.log -Pattern 'register_addon succeeded' -Quiet)) {
            throw "the add-on loaded but reshade::register_addon did not succeed"
          }

          # Registering is not the same as receiving events. These callbacks only exist in a
          # ReShade built with full add-on support (RESHADE_ADDON >= 2), and CLAUDE.md calls out
          # that "wrong ReShade build" would otherwise be indistinguishable from "the game binds
          # differently". Assert the add-on actually saw our pipelines and dispatches.
          $census = Select-String -Path stray-dlss.log -Pattern 'Final census: (.+)$' | Select-Object -First 1
          if (-not $census) { throw "the add-on never logged its final census" }
          Write-Host "Census: $($census.Matches[0].Groups[1].Value)"
          if ($census.Line -match 'compute pipelines=(\d+).*dispatches=(\d+)') {
            if ([int]$Matches[1] -eq 0) { throw "the add-on saw no compute pipelines: init_pipeline never fired" }
            if ([int]$Matches[2] -eq 0) { throw "the add-on saw no dispatches: the dispatch event never fired" }
            Write-Host "Add-on events confirmed live: $($Matches[1]) compute pipelines, $($Matches[2]) dispatches."
          } else { throw "could not parse the census line" }
          if ($p.ExitCode -ne 0) { throw "harness reported failures while running through ReShade" }
          Write-Host "Real ReShade lane passed: the add-on registered and every harness test ran through ReShade's proxy."

      - name: Verify add-on exports
        shell: pwsh
        run: |
          $addon = "build/stray-dlss.addon64"
          if (-not (Test-Path $addon)) { throw "stray-dlss.addon64 was not produced" }
          Write-Host "Size: $((Get-Item $addon).Length) bytes"

          $dumpbin = (Get-Command dumpbin -ErrorAction SilentlyContinue)
          if ($null -eq $dumpbin) { Write-Host "::warning::dumpbin unavailable, skipping export check"; exit 0 }

          $exports = & dumpbin /EXPORTS $addon | Out-String
          Write-Host $exports
          foreach ($sym in @('NAME', 'DESCRIPTION', 'WEBSITE')) {
            if ($exports -notmatch "\b$sym\b") { throw "missing required export: $sym" }
          }
          Write-Host "All required ReShade add-on exports present."

      # The add-on must not depend on the CRT that happens to be in the user's Proton prefix.
      # A /MD build links msvcp140.dll, and an old one (Stray's prefix ships a Nov 2020 copy)
      # faults inside _Mtx_lock the moment a std::mutex built by MSVC 17.10+ is locked. That
      # surfaces as LoadLibraryEx error 998 with no log at all, so guard it here where the
      # failure is legible.
      - name: Verify no dynamic CRT dependency
        shell: pwsh
        run: |
          $deps = & dumpbin /DEPENDENTS build/stray-dlss.addon64 | Out-String
          Write-Host $deps
          foreach ($bad in @('MSVCP140', 'VCRUNTIME140')) {
            if ($deps -match $bad) {
              throw "$bad is imported - the add-on must be built with the static CRT (/MT)"
            }
          }
          Write-Host "No dynamic CRT dependency. Add-on is self-contained."

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $suffix = if ("${{ matrix.ngx }}" -eq "ON") { "" } else { "-nongx" }
          Copy-Item build/stray-dlss.addon64 "dist/stray-dlss$suffix.addon64"
          if (Test-Path build/stray-dlss.pdb) { Copy-Item build/stray-dlss.pdb "dist/stray-dlss$suffix.pdb" }
          Copy-Item README.md dist/
          Copy-Item docs/STRAY-RENDERING-FACTS.md dist/
          # Ship the harness too. CI runs it against WARP; the same binary is run against
          # the real GPU under Proton on the target box via tools/run-harness-proton.sh,
          # which is the only way to exercise vkd3d-proton rather than WARP's model of it.
          if (Test-Path build/stray_dlss_warp.exe) {
            Copy-Item build/stray_dlss_warp.exe "dist/stray-dlss-harness$suffix.exe"
          }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: stray-dlss-addon-ngx-${{ matrix.ngx }}
          path: dist/
          if-no-files-found: error

  # THE ADD-ON HALF OF THE RELEASE. The plugin half lives in dlss-plugin.yml, because an
  # artifact does not cross workflows and each host can only be published by the workflow that
  # built it. Both jobs attach to the SAME tag release, so both must take their notes from the
  # one file below: softprops/action-gh-release resolves the body as
  # `workflowBody || existingReleaseBody`, so two jobs with two different bodies would race and
  # the release would end up describing whichever host happened to finish last.
  release:
    name: Release (ReShade add-on)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build-windows
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4 # for .github/RELEASE_NOTES.md

      - uses: actions/download-artifact@v4
        with:
          name: stray-dlss-addon-ngx-ON
          path: dist-addon

      - name: Package
        run: cd dist-addon && zip -r ../stray-dlss-reshade-addon-${{ github.ref_name }}.zip .

      - uses: softprops/action-gh-release@v2
        with:
          files: stray-dlss-reshade-addon-*.zip
          body_path: .github/RELEASE_NOTES.md
