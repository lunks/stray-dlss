name: StrayDLSS plugin

# A UE4SS C++ plugin cannot be built or tested on the machine that writes it — no Windows, no
# MSVC, no game, no pad (CLAUDE.md §0). This workflow is the ONLY build. It is staged
# cheapest-first so a typo is caught in seconds rather than after a 20-minute SDK build.
#
#   1. mingw    proves the plain-Win32 half (everything but Mod.cpp) plus the vendored MinHook
#               COMPILES AND LINKS, with no SDK — in two minutes
#   2. plugin   the artifact; builds RE-UE4SS from source and links against it
#
# Lifted from dualsense.yml (same box, same UE4SS build, same trap); the pure-logic tests of
# this project run in ci.yml against stray_dlss_core, not here.
#
# Lane 2 is a proxy, not the product: mingw is not MSVC and the plugin MUST be MSVC-built,
# because UE4SS passes std::wstring and std::function across the DLL boundary. It exists
# because it catches the overwhelmingly most common failure — a missing include, a bad format
# specifier — in two minutes and with no dependency on lane 3 succeeding.
#
# ---------------------------------------------------------------------------------------
# READ THIS BEFORE DEBUGGING LANE 3: there is NO released UE4SS C++ SDK.
#
# Verified 2026-09-01 against the v3.0.1 release: its four assets are UE4SS_v3.0.1.zip,
# zCustomGameConfigs.zip, zDEV-UE4SS_v3.0.1.zip and zMapGenBP.zip. zDEV is the DEV BUILD of
# UE4SS (UE4SS.dll + .pdb + Lua mods) — zero .lib, zero .hpp. A C++ mod must therefore be
# built inside a checkout of UE4SS-RE/RE-UE4SS, as the official template does.
#
# And that checkout has a wall in it: `deps/first/Unreal` is a submodule pointing at
# git@github.com:Re-UE4SS/UEPseudo.git, and BOTH that repo and the Re-UE4SS org return 404
# unauthenticated. RE-UE4SS's own CI clones it with `token: ${{ secrets.UEPSEUDO_PAT }}`
# (.github/workflows/cmake_build_ue4ss.yml). Without such a token the submodule cannot be
# fetched, so this workflow falls back to a PINNED PUBLIC MIRROR and says so loudly.
# ---------------------------------------------------------------------------------------

on:
  push:
    branches: [ main, dlss-ue4ss, drop-reshade, viewrectmin-tripwire2, main-integration, dlss-fg, engine-seam-l1, seam-l1-crash, view-cb-identity, drop-pass-finder, shadow-slot-read-bit, shadow-skip-graphics-heaps, colour-input-identity, fix-render-rect, fix-letterbox-continuity, drop-dead-describe-view, drop-fg-throttle-report, shadow-graphics-heaps-off, perf-resolve-split, perf-fg-bucket, perf-skip-unannounced, view-cb-cached-params, view-cb-cached-params-l2, u0-rhi-uav, rr-reflection-denoise, rr-guides-pool-names ]
    tags: [ 'v*' ]
    paths:
      - 'mods/StrayDLSS/**'
      - 'third_party/**'
      - 'src/**'
      - 'shaders/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/dlss-plugin.yml'
  pull_request:
    paths:
      - 'mods/StrayDLSS/**'
      - 'third_party/**'
      - 'src/**'
      - 'shaders/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/dlss-plugin.yml'
  workflow_dispatch:

env:
  # The UE4SS running on the target box: banner "v3.0.1 Beta", Git SHA 68caddcf,
  # Game__Shipping__Win64 (MSVC).
  #
  # TRAP, measured: 68caddcf is a MAIN-BRANCH commit dated 2026-08-31, NOT the v3.0.1 release
  # tag (which is d935b5b2, 2024-02-14). The banner says 3.0.1 only because main's version
  # macros still do while UE4SS_LIB_IS_BETA is set. Building against the TAG would be a
  # different API and a different ABI. Pin the SHA, never the tag.
  UE4SS_SHA: 68caddcf36804b7405424e03e911e6b278324f47

  # Public mirror used only when UEPSEUDO_PAT is absent. It vendors RE-UE4SS's whole tree,
  # `deps/first/Unreal` included. Verified 2026-09-01: its copies of UE4SS/include/Mod/
  # CppUserModBase.hpp and the root CMakeLists.txt are BYTE-IDENTICAL to RE-UE4SS at
  # UE4SS_SHA. That is evidence, not proof, that the Unreal headers match the submodule pin
  # (eb40a05f) — hence the loud warning the job prints when it uses this path.
  UEPSEUDO_MIRROR_REPO: FottenSC/HorseMod
  UEPSEUDO_MIRROR_SHA: e6313df89272949081e298aab1579aeaf2d5866a
  UEPSEUDO_MIRROR_SUBDIR: RE-UE4SS/deps/first/Unreal

  BUILD_CONFIG: Game__Shipping__Win64
  # The same pin as ci.yml's, for the _d import library.
  DLSS_SDK_TAG: v310.7.0

jobs:
  mingw:
    name: Win32 half compiles (mingw proxy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Measured 2026-09-02: a plain `apt-get update && apt-get install` here is USUALLY
      # 15-25s, but run 33660808807 sat on "Install mingw-w64" for 27m45s before the user
      # canceled it — apt's network fetch (the Ubuntu archive mirror `apt-get update` hits,
      # then the .deb downloads) is occasionally catastrophically slow on shared runners, not
      # just averagely slow. Caching the resolved .deb files removes the network dependency on
      # every run after the first: on a cache hit we skip `apt-get update` and `dpkg -i`
      # straight from the cache dir, so a warm run touches no mirror at all. Only two packages
      # were ever requested (not the `mingw-w64` metapackage, which also pulls i686 and
      # Fortran), so --no-install-recommends is the only extra trim available.
      - name: Determine Ubuntu release
        id: os
        run: echo "codename=$(. /etc/os-release && echo "$VERSION_CODENAME")" >> "$GITHUB_OUTPUT"

      - name: Cache mingw-w64 .deb packages
        id: mingw-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/apt-cache/archives/*.deb
          key: mingw-w64-debs-${{ steps.os.outputs.codename }}-gcc-mingw-w64-x86-64-g++-mingw-w64-x86-64-v1

      - name: Install mingw-w64
        run: |
          set -euo pipefail
          APT_CACHE_DIR="${{ runner.temp }}/apt-cache/archives"
          mkdir -p "$APT_CACHE_DIR"
          if [ "${{ steps.mingw-cache.outputs.cache-hit }}" != "true" ]; then
            sudo apt-get update
            sudo apt-get -o Dir::Cache::Archives="$APT_CACHE_DIR" install -y \
              --no-install-recommends --download-only \
              gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
          fi
          sudo dpkg -i "$APT_CACHE_DIR"/*.deb || sudo apt-get install -f -y --no-install-recommends

      # Every source EXCEPT src/Mod.cpp, which is the only file that includes a UE4SS header.
      # That split is why this lane is possible at all, and it is worth preserving. The host
      # calls into the root's native library (MSVC-only to LINK: NGX, fxc-compiled shaders), so
      # this lane COMPILES the host against the root's headers and links nothing.
      - name: Compile the Win32 host and MinHook
        working-directory: mods/StrayDLSS
        run: |
          set -euo pipefail
          mkdir -p /tmp/obj
          for f in ../../third_party/minhook/src/buffer ../../third_party/minhook/src/hook \
                   ../../third_party/minhook/src/trampoline ../../third_party/minhook/src/hde/hde64; do
            echo "--- $f.c"
            x86_64-w64-mingw32-gcc -O2 -Wall -c "$f.c" -o "/tmp/obj/$(basename $f).o"
          done
          for f in Platform Host; do
            echo "--- $f"
            x86_64-w64-mingw32-g++-posix -std=c++20 -Wall -Wextra -Werror \
              -DWIN32_LEAN_AND_MEAN -DNOMINMAX \
              -Isrc -I../../src -I../../third_party/minhook/include -I../../third_party/ngx/include \
              -c "src/$f.cpp" -o "/tmp/obj/$f.o"
          done
          # And the native backend's own sources the host links, as the root's CI cannot
          # (it is MSVC-only there): a syntax pass under mingw's older d3d12.h.
          for f in backend_native/present_owner backend_native/fg_present backend_native/fg_reflex backend_native/native_backend backend_native/d3d12_hooks \
                   backend_native/resource_registry backend_native/descriptor_shadow backend_native/root_shadow \
                   backend_native/vtable_patch engine_seam_hook view_params_hook u0_rhi_hook; do
            echo "--- $f"
            x86_64-w64-mingw32-g++-posix -std=c++20 -Wall -Wextra -Werror -fsyntax-only \
              -DWIN32_LEAN_AND_MEAN -DNOMINMAX -I../../src "../../src/$f.cpp"
          done
          x86_64-w64-mingw32-gcc -c ../../src/backend_native/vtable_slots_check.c -o /tmp/obj/slots.o
          echo "the Win32 host compiles; the DXGI/D3D12 slot numbers are the SDK's"

  # ---------------------------------------------------------------------------------------
  # CACHING, and what must NEVER be cached.
  #
  # Measured on run 33579755872 (cold, 18:00 wall): Clone 8 s, Configure 79 s (FetchContent
  # clones of ten public deps), Build 16:09 — of which ~4 min is the patternsleuth Rust crate
  # through corrosion, ~10 min is cl.exe over Unreal/UE4SS/deps, ~1 min is LTCG linking.
  # Three caches, in order of payoff:
  #
  #   1. sccache over every cl.exe invocation (CMAKE_*_COMPILER_LAUNCHER), GHA cache backend.
  #      Requires /Z7: sccache refuses any /Zi compile whose /Fd is shared between objects
  #      ("shared pdb", src/compiler/msvc.rs), and CMake+Ninja gives every object of a target
  #      the same /Fd. RE-UE4SS's Shipping config hardcodes /Zi, so it is patched below and the
  #      patch is ASSERTED against the configured flags. The linker's /DEBUG:FULL still emits
  #      every PDB from the embedded records.
  #   2. The cargo registry plus corrosion's target dir (build/cargo), keyed on rustc and the
  #      two Cargo.lock files. patternsleuth is a public crate (trumank/patternsleuth).
  #   3. FetchContent's cloned sources (build/_deps/*-src, *-subbuild), keyed on the file that
  #      pins them. All public third-party code.
  #
  # NOT cached, on purpose: the RE-UE4SS checkout itself. Its deps/first/Unreal submodule is
  # the PRIVATE Re-UE4SS/UEPseudo tree of Epic-licensed Unreal headers, fetched with a secret.
  # This repo is public, and a cache saved on the base branch is restorable by a secret-less
  # run (a fork's pull request), so those headers must never be under any cached path. They
  # are not: the caches above hold compiled objects, Rust artifacts and public sources only,
  # and the clone is 8 s anyway. Keep it that way — never add RE-UE4SS/ to a cache path.
  #
  # Also not cached: nvsdk_ngx_d.lib (a ~1 s, 1 MB download; a cache step costs as much).
  # ---------------------------------------------------------------------------------------
  plugin:
    name: Plugin DLL (Windows, MSVC)
    runs-on: windows-latest
    needs: mingw
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7
        with:
          path: repo

      - name: Add MSVC to PATH
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # No major tag exists for this action (v0.0.x only), so it is pinned to the release.
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      # Rust is needed: deps/first/patternsleuth is a Rust crate that RE-UE4SS's CMake drives
      # through corrosion. windows-latest ships a toolchain; assert it rather than discover it
      # halfway through a 20-minute build. The rustc version keys the cargo cache: a target
      # dir built by another rustc is worthless to this one.
      - name: Check the toolchain
        id: toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo --version
          cmake --version
          ninja --version
          sccache --version
          $rustc = (rustc --version)
          Write-Host $rustc
          "rustc=$($rustc.Split(' ')[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # The NGX import library for the DYNAMIC CRT (_d): the plugin is /MD by UE4SS's ABI
      # contract, unlike the add-on (/MT, nvsdk_ngx_s.lib). Fetched, not committed, as ci.yml
      # does for the add-on.
      - name: Fetch the NGX import library (dynamic CRT)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path repo/third_party/ngx/lib | Out-Null
          $url = "https://github.com/NVIDIA/DLSS/raw/$env:DLSS_SDK_TAG/lib/Windows_x86_64/x64/nvsdk_ngx_d.lib"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile repo/third_party/ngx/lib/nvsdk_ngx_d.lib
          $size = (Get-Item repo/third_party/ngx/lib/nvsdk_ngx_d.lib).Length
          Write-Host "nvsdk_ngx_d.lib = $size bytes"
          if ($size -lt 1000000) { throw "nvsdk_ngx_d.lib looks truncated ($size bytes)" }

      - name: Clone RE-UE4SS at the pinned SHA
        shell: pwsh
        env:
          UEPSEUDO_PAT: ${{ secrets.UEPSEUDO_PAT }}
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --no-checkout https://github.com/UE4SS-RE/RE-UE4SS.git RE-UE4SS
          git -C RE-UE4SS fetch --depth 1 origin $env:UE4SS_SHA
          git -C RE-UE4SS checkout --detach FETCH_HEAD
          Write-Host "RE-UE4SS at $(git -C RE-UE4SS rev-parse HEAD)"

          # The submodule URLs are git@github.com:..., which has no credentials in CI, so they
          # are rewritten to https. ONE insteadOf rule per path, matched against the ORIGINAL
          # URL: git applies exactly one rewrite (longest matching prefix) and never re-runs the
          # rules on the result. MEASURED (run 33579551886): two rules meant to chain —
          # ssh -> https, then https -> token — left the ssh URL rewritten to plain https with
          # no credentials, and the clone died on "could not read Username".
          if ($env:UEPSEUDO_PAT) {
            Write-Host "UEPSEUDO_PAT is present: fetching every submodule at its recorded pin."
            git config --global url."https://x-access-token:$env:UEPSEUDO_PAT@github.com/".insteadOf "git@github.com:"
            git -C RE-UE4SS submodule update --init --recursive
          } else {
            git config --global url."https://github.com/".insteadOf "git@github.com:"
            $warn = "UEPSEUDO_PAT is not set. deps/first/Unreal points at the PRIVATE repo " +
                    "Re-UE4SS/UEPseudo (404 unauthenticated), so the Unreal headers are being " +
                    "taken from the public mirror " +
                    "$($env:UEPSEUDO_MIRROR_REPO)@$($env:UEPSEUDO_MIRROR_SHA) instead of the " +
                    "recorded submodule pin eb40a05f. If the resulting DLL fails to load, or " +
                    "loads and then misbehaves, SUSPECT THIS FIRST."
            Write-Host "::warning::$warn"
            # Everything except deps/first/Unreal can come from its real remote.
            git -C RE-UE4SS submodule update --init --recursive -- deps/first/patternsleuth
            git clone --no-checkout https://github.com/$env:UEPSEUDO_MIRROR_REPO.git mirror
            git -C mirror fetch --depth 1 origin $env:UEPSEUDO_MIRROR_SHA
            git -C mirror checkout --detach FETCH_HEAD
            $src = Join-Path (Resolve-Path mirror) $env:UEPSEUDO_MIRROR_SUBDIR
            if (-not (Test-Path (Join-Path $src 'include/Unreal/UObjectGlobals.hpp'))) {
              throw "The mirror does not contain deps/first/Unreal/include/Unreal/UObjectGlobals.hpp at $src"
            }
            $dst = Join-Path (Resolve-Path RE-UE4SS) 'deps/first/Unreal'
            Remove-Item -Recurse -Force $dst -ErrorAction SilentlyContinue
            Copy-Item -Recurse $src $dst
          }

          # The public mirror is from 2026-07-01 and RE-UE4SS at UE4SS_SHA (2026-08-31) has
          # since moved past it. MEASURED 2026-09-01, two failures deep: first the .jmap
          # reflection dumper (commit 5fe9328d) needs Unreal/ScriptContainerLayout.hpp, which
          # the mirror lacks — stubbed below, its whole API is generate_jmap(); then
          # LuaFSoftObjectPath.cpp needs FSoftObjectPath::GetSubPathString, which the mirror's
          # class does not have. THE MIRROR ROUTE DOES NOT BUILD 68caddcf. It stays here so a
          # newer mirror can be dropped in; until then a UEPSEUDO_PAT (a GitHub account linked
          # to Epic Games, RE-UE4SS/README.md:80-82) is REQUIRED for this workflow to produce
          # a DLL.
          if (-not $env:UEPSEUDO_PAT -and -not (Test-Path 'RE-UE4SS/deps/first/Unreal/include/Unreal/ScriptContainerLayout.hpp')) {
            Write-Host "::warning::deps/first/Unreal from the mirror lacks Unreal/ScriptContainerLayout.hpp; stubbing UE4SS's JMapGenerator (generate_jmap) so UE4SS.dll still links. The .jmap dumper is unavailable in this build."
            Set-Content RE-UE4SS/UE4SS/src/JMapGenerator/JMapGenerator.cpp @(
              '// STUB written by stray-dlss CI (.github/workflows/dlss-plugin.yml): the public UEPseudo',
              '// mirror predates Unreal/ScriptContainerLayout.hpp. The real generator is 5fe9328d.',
              '#include <JMapGenerator/JMapGenerator.hpp>',
              '#include <DynamicOutput/DynamicOutput.hpp>',
              'namespace RC::JMapGenerator',
              '{',
              '    auto generate_jmap(bool, bool) -> void',
              '    {',
              '        Output::send<LogLevel::Error>(STR("generate_jmap: unavailable in this UE4SS build (stray-dlss CI stub; UEPseudo mirror lacks ScriptContainerLayout.hpp)\n"));',
              '    }',
              '}')
          }

          # Whichever route was taken, the header a C++ mod cannot build without must exist.
          foreach ($h in @('RE-UE4SS/UE4SS/include/Mod/CppUserModBase.hpp',
                           'RE-UE4SS/deps/first/Unreal/include/Unreal/UObjectGlobals.hpp',
                           'RE-UE4SS/deps/first/Unreal/include/Unreal/UFunctionStructs.hpp')) {
            if (-not (Test-Path $h)) { throw "missing required header: $h" }
          }
          Write-Host "UE4SS sources are complete."

      # Cache 2: the cargo registry and corrosion's target dir. Only PUBLIC crates live here
      # (see the block comment above the job). The key needs the Cargo.lock files, which exist
      # only after the clone, so this step sits after it. The prefix fallback is safe for the
      # same reason: nothing under these paths came from a secret.
      - name: Cache cargo (patternsleuth)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            build/cargo
          key: cargo-${{ runner.os }}-${{ steps.toolchain.outputs.rustc }}-${{ hashFiles('RE-UE4SS/deps/first/patternsleuth/Cargo.lock', 'RE-UE4SS/deps/first/patternsleuth_bind/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ steps.toolchain.outputs.rustc }}-

      # Cache 3: FetchContent's clones (glaze, glfw, imgui, fmt, polyhook2, zydis, raw_pdb,
      # corrosion, ...), all public. Keyed on the file that pins them; NO prefix fallback, so a
      # changed pin set starts clean rather than reusing a tree at the wrong tag.
      - name: Cache FetchContent sources
        uses: actions/cache@v6
        with:
          path: |
            build/_deps/*-src
            build/_deps/*-subbuild
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('RE-UE4SS/deps/third/CMakeLists.txt') }}

      # Cache 1's precondition: RE-UE4SS's Shipping config compiles with /Zi
      # (cmake/modules/CompilerOptions/msvc-compatible.cmake), which propagates to every
      # target in the build, ours included. Under CMake+Ninja that is a per-TARGET shared PDB,
      # which sccache cannot cache ("shared pdb"). /Z7 embeds the same records in each .obj;
      # the link (/DEBUG:FULL) still produces every PDB. The substitution is asserted here and
      # the configured flags are asserted again after Configure.
      - name: Embed debug info (/Z7) so sccache can cache the compiles
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $f = 'RE-UE4SS/cmake/modules/CompilerOptions/msvc-compatible.cmake'
          $before = Get-Content $f -Raw
          $after = $before -replace 'set\(Shipping_FLAGS "/Zi" PARENT_SCOPE\)', 'set(Shipping_FLAGS "/Z7" PARENT_SCOPE)'
          if ($after -eq $before) {
            throw "$f no longer contains 'set(Shipping_FLAGS ""/Zi"" PARENT_SCOPE)': RE-UE4SS changed its flag plumbing. Re-derive the /Z7 substitution before trusting sccache."
          }
          Set-Content $f $after -NoNewline
          Select-String -Path $f -Pattern 'Shipping_FLAGS' | ForEach-Object { Write-Host $_.Line }

      # The layout RE-UE4SS documents for C++ mods: a parent project that adds RE-UE4SS and
      # then the mod. mods/StrayDLSS/CMakeLists.txt detects the UE4SS target and builds the
      # DLL only in that case.
      - name: Lay out the parent project
        shell: pwsh
        run: |
          # The mod is built IN PLACE inside the checkout (not copied out like the DualSense
          # one), because its CMakeLists reaches ../../third_party for MinHook and, later, the
          # shared native backend sources.
          Set-Content CMakeLists.txt @(
            'cmake_minimum_required(VERSION 3.22)',
            'project(StrayDLSSBuild)',
            'add_subdirectory(RE-UE4SS)',
            'add_subdirectory(repo/mods/StrayDLSS StrayDLSS)')
          Get-Content CMakeLists.txt

      # Quoted: pwsh does not expand $env: inside a bare -D argument (measured: CMake received the
      # literal text "$env:BUILD_CONFIG").
      #
      # FETCHCONTENT_UPDATES_DISCONNECTED: with cache 3 restored, skip the per-dep update step
      # (the pins cannot have moved without a new cache key). CMAKE_MSVC_DEBUG_INFORMATION_FORMAT
      # is belt and braces: it turns any CMake-injected debug-format flag into /Z7 too.
      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build -G Ninja "-DCMAKE_BUILD_TYPE=$($env:BUILD_CONFIG)" `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded `
            -DFETCHCONTENT_UPDATES_DISCONNECTED=ON
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed ($LASTEXITCODE)" }
          # The /Z7 substitution must have reached the flags every object is compiled with, and
          # the launcher must have landed: a cache that silently never engaged is a no-op, not a
          # speed-up. Read the generated build.ninja, not CMakeCache.txt: MEASURED (run
          # 33590145973), CMAKE_C_FLAGS_GAME__SHIPPING__WIN64 is an EMPTY cache entry - CMake
          # pre-creates the per-config flag variable for the active build type, so RE-UE4SS's
          # "if(NOT DEFINED ...)" composition never writes it and its flags reach targets only
          # through target compile options. Only the per-object FLAGS lines tell the truth.
          $ninja = Get-Content build/build.ninja
          $flagLines = @($ninja | Where-Object { $_ -match '^\s*FLAGS = ' })
          $z7 = @($flagLines | Where-Object { $_ -match '/Z7\b' })
          $zi = @($flagLines | Where-Object { $_ -match '/Zi\b' })
          Write-Host "build.ninja FLAGS lines: total=$($flagLines.Count) with /Z7=$($z7.Count) with /Zi=$($zi.Count)"
          foreach ($obj in @('UE4SS.dir\\src\\UE4SSProgram.cpp.obj', 'Unreal.dir\\src\\UObjectGlobals.cpp.obj', 'StrayDLSS.dir\\src\\Mod.cpp.obj')) {
            $i = [array]::FindIndex($ninja, [Predicate[string]]{ param($l) $l -match "^build .*$obj" })
            if ($i -lt 0) { throw "build.ninja has no build edge for $obj" }
            $edge = $ninja[($i + 1)..($i + 14)]
            $f = $edge | Where-Object { $_ -match '^\s*FLAGS = ' } | Select-Object -First 1
            $l = $edge | Where-Object { $_ -match '^\s*LAUNCHER = ' } | Select-Object -First 1
            Write-Host "$obj`n  $f`n  $l"
            if ($f -notmatch '/Z7\b') { throw "$obj is not compiled with /Z7: $f" }
            if ($l -notmatch 'sccache') { throw "$obj is not compiled through sccache: '$l'" }
          }
          if ($z7.Count -eq 0) { throw "no object in build.ninja is compiled with /Z7" }
          if ($zi.Count -gt 0) { $zi | Select-Object -First 3 | ForEach-Object { Write-Host $_ }; throw "$($zi.Count) FLAGS lines still carry /Zi, which sccache cannot cache" }
          $cache = Get-Content build/CMakeCache.txt
          foreach ($lang in @('C', 'CXX')) {
            $launcher = $cache | Where-Object { $_ -like "CMAKE_${lang}_COMPILER_LAUNCHER:*" }
            Write-Host $launcher
            if ($launcher -notmatch 'sccache') { throw "CMAKE_${lang}_COMPILER_LAUNCHER is not sccache: $launcher" }
          }
          # CMake's Ninja generator routes the launcher through a per-object "LAUNCHER = sccache "
          # variable on each build edge, and the compile rule in CMakeFiles/rules.ninja carries
          # only the "$LAUNCHER" placeholder (cmNinjaTargetGenerator.cxx: vars["LAUNCHER"]).
          # MEASURED, runs 33590431194 and 33591180067: "sccache" appears in NO "command =" line
          # of either file, so a rule grep can never see it. Count the edges instead.
          $launched = @($ninja | Where-Object { $_ -match '^\s*LAUNCHER = .*sccache' })
          # Informational only: on Windows the rule command wraps the placeholder in a
          # cmd.exe /C "..." prefix (MEASURED, run 33591481886: 530 edges carried the launcher
          # while a '^command = $LAUNCHER' anchor matched nothing), so this count is not asserted.
          $placeholders = @(Get-Content build/CMakeFiles/rules.ninja | Where-Object { $_ -match '^\s*command = .*\$LAUNCHER' })
          Write-Host "build.ninja objects with 'LAUNCHER = sccache': $($launched.Count); rules.ninja rules mentioning `$LAUNCHER: $($placeholders.Count)"
          if ($launched.Count -eq 0) { throw "no build.ninja object carries LAUNCHER = sccache: the launcher did not reach the generator" }

      # Only our target. Ninja pulls in whatever of UE4SS the link needs and nothing else,
      # which is a great deal less than building all of UE4SS, UVTD and the bundled cppmods.
      - name: Build the plugin
        shell: pwsh
        run: |
          sccache --zero-stats | Out-Null
          cmake --build build --target StrayDLSS --parallel
          if ($LASTEXITCODE -ne 0) { throw "build failed ($LASTEXITCODE)" }

      # Read this to know whether the cache did anything: "Cache hits" against "Cache misses",
      # and every "Non-cacheable" reason. Zero compile requests means the launcher never
      # engaged - that is a fault in the caching, so it fails the job.
      - name: sccache stats
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stats = & sccache --show-stats | Out-String
          Write-Host $stats
          $m = [regex]::Match($stats, 'Compile requests\s+(\d+)')
          if (-not $m.Success) { throw "sccache --show-stats printed no 'Compile requests' line" }
          if ([int]$m.Groups[1].Value -eq 0) { throw "sccache saw zero compile requests: the compiler launcher never engaged" }

      # A DLL that does not export start_mod/uninstall_mod is FreeLibrary'd by UE4SS with a
      # warning and nothing else happens (UE4SS/src/Mod/CppMod.cpp resolves both by literal
      # name). Check it here rather than discovering it in the game.
      - name: Verify the mod exports
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse -Filter StrayDLSS.dll build | Select-Object -First 1
          if (-not $dll) { throw "StrayDLSS.dll was not produced" }
          Write-Host "$($dll.FullName)  $($dll.Length) bytes"
          $exports = & dumpbin /EXPORTS $dll.FullName | Out-String
          Write-Host $exports
          foreach ($sym in @('start_mod', 'uninstall_mod')) {
            if ($exports -notmatch "\b$sym\b") { throw "missing required export: $sym" }
          }
          # /MD is an ABI contract with UE4SS (see mods/StrayDLSS/CMakeLists.txt). A /MT
          # build would allocate in its own heap and free in UE4SS's, which is silent
          # corruption rather than a load failure — so assert the dependency is THERE.
          # NGX is linked statically (nvsdk_ngx_d.lib); nvngx_dlss.dll is loaded at run time
          # from the game directory, so no nvngx import is expected here.
          $deps = & dumpbin /DEPENDENTS $dll.FullName | Out-String
          Write-Host $deps
          if ($deps -notmatch 'MSVCP140') {
            throw "MSVCP140.dll is NOT imported: the mod was built with the static CRT (/MT). " +
                  "UE4SS passes std::wstring and std::function across the DLL boundary and is " +
                  "built /MD; mixing them corrupts the heap."
          }
          if ($deps -notmatch 'UE4SS.dll') {
            throw "UE4SS.dll is not imported - the mod did not actually link against UE4SS."
          }
          "dll=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        id: verify

      # A UE4 crash dump names a module by its FILENAME, so the deployed name IS the identity.
      # The PDB path stamped into the PE's debug directory is what a symbolizer then resolves
      # against, so it must be a bare `StrayDLSS.pdb` (the name the artifact ships) rather than
      # the linker's default absolute build path. Assert it on the BUILT DLL: a change that
      # renamed only the file on disk would look fixed and would still symbolize to nothing.
      - name: Verify the module identity the DLL records
        shell: pwsh
        run: python repo/tools/pe_debug_dir.py "${{ steps.verify.outputs.dll }}" --expect StrayDLSS.pdb

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/StrayDLSS/dlls | Out-Null
          # SHIPPED AS StrayDLSS.dll, NOT main.dll. UE4SS tries <Mods>/<ModName>/dlls/main.dll
          # first and falls back to dlls/<ModName>.dll (CppMod.cpp:24-35 at UE4SS 68caddcf), where
          # <ModName> is the mod DIRECTORY name verbatim (UE4SSProgram.cpp:1422) and is still
          # intact there because Mod::Mod COPIES it (Mod.cpp:45). So this loads under
          # Mods/StrayDLSS/, and a UE4 crash dump then says `StrayDLSS 0x<base> + <rva>` instead
          # of `main`, which no dump could attribute while both plugins were deployed.
          #
          # main.dll WINS whenever both exist, and silently. An install must therefore DELETE a
          # stale dlls/main.dll and dlls/main.pdb, never just write these beside them - see
          # mods/StrayDLSS/README.md and tools/dualsense/deploy-submix-spike.sh.
          Copy-Item "${{ steps.verify.outputs.dll }}" dist/StrayDLSS/dlls/StrayDLSS.dll
          # The PDB is produced by the link (/DEBUG) from the /Z7 records in the objects. It used
          # to be copied only if present; with the debug-format change it is asserted instead,
          # so a build that silently lost its symbols cannot ship.
          $pdb = [IO.Path]::ChangeExtension("${{ steps.verify.outputs.dll }}", '.pdb')
          if (-not (Test-Path $pdb)) { throw "StrayDLSS.pdb was not produced next to the DLL ($pdb)" }
          # Shipped as StrayDLSS.pdb, NOT main.pdb: that is the name the DLL's own debug directory
          # records (/PDBALTPATH, asserted in the step above), and a symbolizer looks for exactly
          # that name next to the binary. It used to ship as main.pdb, which no dump could resolve
          # until somebody renamed it by hand.
          Copy-Item $pdb dist/StrayDLSS/dlls/StrayDLSS.pdb
          Copy-Item repo/mods/StrayDLSS/StrayDLSS.ini dist/StrayDLSS/
          Copy-Item repo/mods/StrayDLSS/README.md dist/
          Set-Content dist/mods.txt.fragment @(
            '; Add this line to <game>/ue4ss/Mods/mods.txt, ABOVE the Keybinds line.',
            'StrayDLSS : 1')
          Get-ChildItem -Recurse dist

      # The staged tree is what the user installs, so assert the identity ON IT: the DLL's own
      # filename (a regression to main.dll fails here rather than on the box) and the PDB name
      # its debug directory records. And no main.* may be in the artifact at all - main.dll takes
      # precedence over StrayDLSS.dll, so one shipped by accident would silently restore the
      # ambiguity this whole change removes.
      - name: Verify the staged layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python repo/tools/pe_debug_dir.py dist/StrayDLSS/dlls/StrayDLSS.dll `
            --expect-dll StrayDLSS.dll --expect StrayDLSS.pdb
          if ($LASTEXITCODE -ne 0) { throw "the staged DLL does not carry its own identity" }
          foreach ($stale in 'dist/StrayDLSS/dlls/main.dll', 'dist/StrayDLSS/dlls/main.pdb') {
            if (Test-Path $stale) {
              throw "$stale is in the artifact: main.dll takes precedence over StrayDLSS.dll, so " +
                    "shipping it would silently restore the ambiguous module name."
            }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: stray-dlss-plugin
          path: dist/
          if-no-files-found: error

  # THE PLUGIN HALF OF THE RELEASE, AND THE ONE THAT MATTERS. Until 2026-09-03 the only
  # released artefact came from ci.yml and was the ReShade ADD-ON - a second host that is still
  # built and tested but is not how the project runs and not what the documentation describes,
  # so every download was a build nobody was running. An artifact does not cross workflows, so
  # the release for each host has to be published by the workflow that built it.
  #
  # Both jobs attach to the SAME tag release and therefore share ONE notes file:
  # softprops/action-gh-release resolves the body as `workflowBody || existingReleaseBody`, so
  # two different bodies would race and the release would describe whichever host finished last.
  #
  # The tag trigger on this workflow is what gets us here. `paths:` above does NOT suppress it:
  # GitHub evaluates path filters for branch pushes and pull requests only, never for a tag
  # push, so a `v*` tag runs this whole workflow - the expensive MSVC job included - regardless
  # of what the tag's commit touched. That is the intent (a release must build), and it does not
  # change when the job runs for ordinary branch or PR pushes. SOFT: this is GitHub's actual
  # behaviour by consistent report rather than by an explicit sentence in their docs, and the
  # first real tag is what confirms it. If a tag ever produces no plugin asset, this is the
  # first thing to check.
  release:
    name: Release (UE4SS plugin)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: plugin
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4 # for .github/RELEASE_NOTES.md

      - uses: actions/download-artifact@v4
        with:
          name: stray-dlss-plugin
          path: dist

      - name: Package
        run: cd dist && zip -r ../stray-dlss-plugin-${{ github.ref_name }}.zip .

      - uses: softprops/action-gh-release@v2
        with:
          files: stray-dlss-plugin-*.zip
          body_path: .github/RELEASE_NOTES.md
