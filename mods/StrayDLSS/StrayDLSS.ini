; StrayDLSS - configuration for the UE4SS plugin host. Read from THIS file at startup; the keys
; the in-game tuning tab exposes (NgxNR* sliders, NgxNRMVecScale, NgxNR, ...) are also
; re-applied whenever the file changes on disk. Everything else needs a relaunch.
;
; One line per key here. The reasoning, the measurements and the history behind every value
; are in CLAUDE.md (sections 2-5) and docs/STRAY-RENDERING-FACTS.md - read those before
; changing anything that is not a plain on/off. A deploy passes every key, every time: a key
; missing here keeps its built-in default, and a stale value here is what gets passed.
[STRAYDLSS]

; --- host / native D3D12 hooks ---
TweakUi=1
; TweakUi: the "StrayDLSS" live-tuning tab in UE4SS's debug GUI + ini hot-reload of its knobs.
NativeMode=drive
; NativeMode: always `drive` under this host (there is no other backend); anything else is ignored.
ShadowGraphicsHeaps=0
; ShadowGraphicsHeaps: 1 also shadows RTV/DSV descriptors (nothing reads them today).
NativeSentinel=1
NativeInstall=all
EnableNGX=1
NgxEvaluate=1
HashShaders=1
DumpShaders=0
; DumpShaders: 1 writes every DXBC seen to disk (for tools/dispatch_census.py). Diagnostic.

; --- motion vectors (shaders/mv_resolve.hlsl): dense RG16F from the engine's sparse velocity ---
MvResolve=1
MvDispatch=2
MvRestoreHeaps=1
MvRestoreState=1
MVConvention=0
MVInvertX=0
MVInvertY=0
; MvStats: the per-pixel census (engine-written vs reconstructed, movers, w<=0, clamped), printed
; as MV CENSUS every MvStatsFrames dispatches. The vectors are bit-identical either way. Diagnostic.
MvStats=0
MvStatsFrames=300
; MvMask: DLSS SR's bias-current-colour mask ("do not trust the history here"), a CONSTANT fill
; of MvMaskValue (0 = neutral). MvMaskAlternate flips it every N frames inside one session for
; an honest A/B (MV MASK PHASE in the log). MvMaskFormat 0 R8_UNORM, 1 R16_FLOAT, 2 RGBA8.
; CHANGES THE IMAGE; untested on the box. Ask before running.
MvMask=0
MvMaskValue=1.0
MvMaskAlternate=0
MvMaskFormat=0

; --- DLSS Super Resolution ---
NgxPreset=13
; NgxPreset: 10 J, 11 K, 12 L, 13 M. J/K/M are visually indistinguishable here (user-judged).
NgxExposure=auto
; NgxExposure: auto | texture | owned. Exposure input is honoured only by presets J and K.
NgxExposureScale=1.0

; --- render-target pool names + Ray Reconstruction ---
PoolNames=1
; PoolNames: 0 off, 1 discover and log (default), 2 install the forwarding recorder into the
; game's own code and assert names, 3 also supply GBufferA/B/C to RR. 2+ patch engine code.
NgxRR=0
; NgxRR: 0 off, 1 probe (one DLSSD create, released), 2 RR replaces the SR evaluate (needs
; PoolNames=3). Read RR PROBE ARMED / [rrprobe] / [rr] - the path is never silent by design.

; --- DLSS SR diagnostics (all default off; each costs a round trip to interpret) ---
NgxDryRun=0
; NgxDryRun: suppress the matched pass and write nothing (1 pinned, 2 every structural match,
; 3 every relaxed candidate). NgxPaint clears the output magenta instead of evaluating.
; NgxDumpInputs dumps colour/depth/MV/output (and the RR guides) as straydlss_*.bin at NgxDumpAt.
NgxDumpInputs=0
NgxPaint=0
NgxPassHash=0
DryRunAlternate=0
DryRunHash=0

; --- the engine seam: UE 4.27's own ITemporalUpscaler names the TAA pass ---
EngineSeam=3
; EngineSeam: 0 heuristic only, 1 scan and log, 2 stand in and cross-check, 3 AUTHORITATIVE
; (default): DLSS SR runs only on the dispatch the engine announced; hash and signature are
; assertions. `unclaimed` on the [seam] line must stay 0.
EngineSeamFallback=1
; EngineSeamFallback: at level 3 with no live seam, run the heuristic (announced at ERROR); 0
; runs no DLSS instead.
EngineSeamInputs=1
; EngineSeamInputs: depth and velocity from the engine's own FPassInputs, resolved inside
; AddPasses where they are alive. `l1: partial=` tracking `claimed=` is the success state.
EngineSeamViewParams=2
; EngineSeamViewParams: the View constant buffer from FViewInfo's cached struct (offset
; discovered and latched against the bound buffer). 1 discover and report, 2 authoritative
; once latched (default; worst case is level 1), 0 off. Needs EngineSeam=3 and EngineSeamInputs=1.
U0Hook=1
; U0Hook: the TAA output UAV named by the RHI bind stream. 1 discover (default), 2 observe and
; assert against the descriptor walk (`[u0] assert: disagree=` must stay 0), 3 not built.

; --- DLSS Neural Rendering, NGX feature 18: a PRESENT STAGE over the back buffer ---
NgxNR=1
NgxNRIdentity=nvngx
; NgxNRIdentity: the caller name the snippet is told; it must contain "nvngx.dll".
NgxNRWarmupFrames=60
; NgxNRWarmupFrames: presents before the first evaluate (the snippet initialises lazily).
NgxNRPreset=1
NgxNRIntensity=1
NgxNRLocalTone=1.05
NgxNRLocalStructure=1.61
NgxNRSkinStructure=2
; Intensity is the only strength that does not wipe the network's history when changed;
; Tone/Structure/Skin/Style hold DLSSNR.Reset while they move - set, release, wait, then judge.
NgxNRAutoMask=1
NgxNRUICorrection=1
NgxNRMVecScale=0
; NgxNRMVecScale: 0 = 1.0 (the user's live A/B; the geometric 2.0 was less stable).
NgxNRDepthInverted=1

; --- DLSS Frame Generation (NGX feature 11, no Streamline): present twice per game frame ---
NgxFG=0
NgxFGMode=2
; NgxFGMode: 1 stage-1 experiment (previous real frame + magenta band, no NGX), 2 DLSS-G.
NgxFGPacing=1
; NgxFGPacing: 1 worker thread paced against the previous real present (default), 0 back to
; back (the bimodal control), 2 both on the game thread NgxFGWaitMs apart (-1 = half interval).
NgxFGWaitMs=-1
NgxFGBand=1
NgxFGValidate=1
; NgxFGValidate: a generated frame reaches the screen only after the crop readback passes.
NgxFGReflex=1
; NgxFGReflex: 0 off, 1 low-latency + Sleep + markers, 2 also boost. Through DXVK-NVAPI.
NgxFGWaitableSwapChain=0
NgxFGThrottle=0
NgxFGMaxLatency=2
NgxFGThrottleTimeoutMs=50
NgxFGThrottleGiveUp=8
; The flip-queue throttle (all off): WaitableSwapChain adds the DXGI waitable flag at creation,
; Throttle waits for a flip slot before each present, MaxLatency bounds the queue (2 = one
; pair), TimeoutMs bounds one wait, GiveUp disarms after N consecutive timeouts (0 never).
NgxFGOutOfBandQueue=0
; NgxFGOutOfBandQueue: NvAPI_D3D12_NotifyOutOfBandCommandQueue, 0 off, 1 present, 3 render+present.
NgxFGHDR=-1
; NgxFGHDR: -1 auto from the swapchain colour space (Stray never sets one, so SDR), 0, 1.
NgxFGWarmupFrames=60
NgxFGCameraNear=0.01
NgxFGCameraFar=75000
; NgxFGCameraNear/Far: NVIDIA's own synthetic pair; 0 is a degenerate range, never "infinite".
NgxFGMvecScale=1
; NgxFGMvecScale: 1 pixels -> Streamline's 1/renderWidth convention, 2 = 1.0 (A/B).
NgxFGOutputReal=1

; --- periodic files and watches ---
VramQueryWatch=0
; VramQueryWatch: names and times callers of QueryVideoMemoryInfo. Diagnostic.
StatusFile=1
StatusFileFrames=30
; StatusFile: the stray-dlss-status.txt heartbeat, rewritten every StatusFileFrames presents.
StageFile=0
; StageFile: the stray-dlss-stage.txt crash breadcrumb, six synchronous writes per TAA dispatch.
; Off unless a crash needs its step named.

; Keys the plugin also reads, left at their built-in defaults (uncomment to override):
;PerfLog=                   ; the periodic fps / worst-frame / CPU-share report (default on)
;StallWatch=                ; stall detection around the evaluate (default on)
;ShadowMode=                ; descriptor-shadow strategy
;NgxFGTrace=                ; per-present frame-generation trace, very verbose
;NgxNRPreload=              ; LoadLibrary the NR snippet at device init
;NgxNRStyle=                ; DLSSNR.Style
;NgxNRDll=                  ; path override for nvngx_dlssnr.dll
;NgxNRStageBackBufferState= ; assumed D3D12 state of the back buffer at the NR stage
;NgxSnippetPath=            ; path override for the NGX snippet
;NgxDumpAt=                 ; first NgxDumpInputs capture point (set past the loading screen)
;NgxRecreateStableFrames=   ; frames a new rect must persist before DLSS SR is recreated
