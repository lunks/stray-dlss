; StrayDLSS — configuration, read by the UE4SS host from THIS file (hot-reloaded; keys read at
; startup keep their value until relaunch). The same [STRAYDLSS] keys the ReShade add-on reads
; from ReShade.ini, seeded 2026-09-02 from the box's known-good ReShade.ini.
;
; NativeMode is always `drive` under this host: it has no ReShade backend to fall back to. A
; different value is logged and ignored.

; ShadowGraphicsHeaps=0: the descriptor shadow records CBV_SRV_UAV descriptors only. Its RTV and
; DSV halves have no reader left - the dataflow pass finder that described a draw's render
; targets was deleted 2026-09-03, and the differential observer resolves COMPUTE tables only -
; so recording them was a per-view write and a slot array per heap paid for nobody. Set 1 to
; record them again (a future custom-depth-by-DSV consumer would want that).

[STRAYDLSS]
NativeMode=drive
ShadowGraphicsHeaps=0
NativeSentinel=1
NativeInstall=all
EnableNGX=1
NgxEvaluate=1
HashShaders=1
DumpShaders=0
MvResolve=1
MvDispatch=2
MvRestoreHeaps=1
MvRestoreState=1
MVConvention=0
MVInvertX=0
MVInvertY=0

; --- The motion-vector CENSUS (src/core/mv_census.hpp). LEVEL 1: measures, changes nothing. ---
;
; MvStats=1 makes shaders/mv_resolve.hlsl additionally count, per pixel, which of its two
; branches ran - UE 4.27's own sparse velocity where the engine WROTE one, or our camera
; reconstruction from reversed-Z depth and ClipToPrevClip everywhere else. The vector written
; to the motion-vector texture is BIT-IDENTICAL either way; the counters are reduced through
; LDS into a root UAV and cost nothing when this is 0.
;
; THE NUMBER IT EXISTS FOR has never been measured on this title, and it bounds everything
; downstream: if the engine writes 95% of the field, the reconstruction's quality barely
; matters; if it writes 40%, it matters a great deal. Stray ships r.BasePassOutputsVelocity=True
; (CLAUDE.md 2.3.1), which broadens coverage beyond stock UE4 by an unknown amount.
;
; Read the MV CENSUS lines (one per window) and MV CENSUS TOTAL (every 600 presents). The
; report REFUSES to print percentages when its own invariants fail - a broken instrument that
; prints plausible numbers anyway is worse than one that stops, because the numbers get quoted.
;
; Four counters beyond the split are worth reading: `genuinely moving` separates real movers
; from static geometry the base pass merely happened to write; `w<=0 rejected` counts pixels
; that were handed an exact ZERO, which DLSS reads as "static" rather than as "unknown";
; `far/sky` is device_z == 0 under reversed-Z; and `non-finite` must be 0.
;
; MvStatsFrames is the window in dispatches. The GPU counters are uint32 and are zeroed each
; window, so the ceiling is 2^32 / render pixels - about 2071 frames at 1920x1080. 300 is well
; inside it and a longer window is warned about at runtime rather than silently wrapping.
MvStats=0
MvStatsFrames=300

; --- The DLSS bias-current-colour MASK (src/core/mv_mask_plan.hpp). LEVEL 2. ---
;
; pInBiasCurrentColorMask is DLSS SR's own per-pixel "do not trust the history here" channel.
; We have never sent one. It is the honest treatment for content whose motion vectors are
; structurally WRONG rather than merely inaccurate - screen-space reflections above all, which
; move with the reflected geometry while our vectors describe the reflecting surface. CLAUDE.md
; 5 calls that a structural mismatch and lists the moves as "reduce strength, disable SSR, or
; accept it"; this is the fourth, and it is the one NVIDIA built for it.
;
; MvMask=1 CHANGES THE IMAGE by design. Stage 1 is a CONSTANT fill, deliberately: a mask that
; is silently ignored and a mask that is bound and doing nothing look identical on a screenshot,
; so the plumbing has to be proven with a value whose effect is known before any content signal
; is written. A full-strength constant that changes nothing on screen is a clean negative that
; settles the whole idea for one launch's cost.
;
; MvMaskValue is the fill. 0 is neutral and is exactly the same as binding nothing; higher
; means "prefer this frame's colour over the history".
;
; MvMaskAlternate flips between neutral and MvMaskValue every N frames, logging MV MASK PHASE,
; so the A/B happens INSIDE one session. That is the only way this project has ever compared a
; temporal change honestly (CLAUDE.md 5, after three false starts) - across launches the scene
; differs and the comparison is worthless. The FIRST half-period is the neutral control.
; 900 is a reasonable value at ~55 fps. 0 holds MvMaskValue continuously.
;
; MvMaskFormat exists because NVIDIA documents no required format for this input and the
; runtime validates none: 0 = R8_UNORM (what the one third-party integration known to drive
; this input successfully uses), 1 = R16_FLOAT, 2 = R8G8B8A8_UNORM.
MvMask=0
MvMaskValue=1.0
MvMaskAlternate=0
MvMaskFormat=0
NgxPreset=13
NgxExposure=auto
NgxExposureScale=1.0
; PoolNames: the render-target pool's NAME hook (src/pool_name_hook.hpp). UE 4.27 hands
; FRenderTargetPool::FindFreeElement every pooled target's debug name as a live const TCHAR*
; argument, in Shipping - so GBufferA-E can be identified by the ENGINE'S OWN NAME instead of
; by descriptor shape. 0 off, 1 DISCOVER (scan and log, install nothing - the default),
; 2 OBSERVE (also install a forwarding recorder into the game's own code and assert each name
; against the routes that already answer for depth and velocity), 3 SUPPLY (also let the Ray
; Reconstruction path read the GBufferA/B/C records). 2 and 3 write an inline trampoline into
; the game's code, gated on the static scan clearing its agreement bar; that is why it is not
; the default and why NgxRR does not turn it on for you.
PoolNames=1
; NgxRR: DLSS Ray Reconstruction. 0 off (default), 1 PROBE (one DLSSD create attempt, released;
; answers "does RR exist on this stack under vkd3d-proton" and changes no frame), 2 FULL (RR
; replaces the SR evaluate on every frame whose engine-named GBufferA/B/C set is usable; SR
; carries every other frame with a counted, named reason on the [rr] line).
;
; WHILE NgxRR IS NON-ZERO THE LOG CANNOT BE SILENT ABOUT IT. Grep for, in this order:
;   RR PROBE ARMED   - printed the moment the mode is read
;   [rrprobe]        - printed every 600 frames whatever happened, INCLUDING "nothing did",
;                      with state= naming which of the seven outcomes it was
;   [rr]             - the evaluate totals, or one NOT ASKED line saying why there are none
; The same numbers are in stray-dlss-status.txt as rr_probe_state / rr_probe_ensure_calls /
; rr_probe_result. Two channels on purpose: a 2026-09-04 run armed NgxRR=1, created an SR
; feature, and produced no probe output at all, which reads identically to "RR does not exist".
;
; MODE 2 NEEDS PoolNames=3. Its guides come from the pool name hook above and are resolved by
; src/gbuffer_resolve.hpp with NVIDIA's own UE-plugin recipe. The heuristic G-buffer finder that
; used to supply them was deleted 2026-09-03 for identifying GBufferA-E by descriptor SHAPE and
; must not be rebuilt (docs/RESEARCH-ENGINE-TAA-HOOK.md 13).
;
; NOTHING ON THIS PATH HAS EVER RUN AGAINST THE GAME. Read the [rr] line's refusal counters
; before reading the image, and set NgxDumpInputs=1 to get the four guides as
; straydlss_rr_*.bin - tools/rawdump2png.py rgba16f_normal prints the DEGENERATE fraction,
; which is the one number that says whether the named G-buffer still had content when we read
; it. And note the prior question is still open: r.RayTracing=False, r.SSGI.Enable=0 and
; Stray's own r.SSR.Temporal=1 may leave RR no noisy signal to denoise at all
; (docs/RESEARCH-RR-REFLECTION-DENOISE.md). RR running is not RR being worth running.
NgxRR=0
NgxDryRun=0
NgxDumpInputs=0
NgxPaint=0
NgxPassHash=0
DryRunAlternate=0
DryRunHash=0
; --- the engine's own upscaler seam (src/core/engine_seam.hpp, docs/RESEARCH-ENGINE-TAA-HOOK.md) ---
; Which compute dispatch is Stray's TAA pass is currently decided BEHAVIOURALLY - a DXBC hash, a
; depth+stencil-SRV-over-one-resource signature, dispatch-rect arithmetic - all of it a legacy of
; the ReShade era, and all of it capable of picking a look-alike. UE 4.27 has a first-class answer:
; ITemporalUpscaler::AddPasses is the ONE call site of the primary temporal upscale, and every
; documented look-alike (DOF, light shafts, SSR, water, planar reflections) reaches
; FTAAStandaloneCS by a route that never touches it.
;
; EngineSeam=0  off. Nothing is scanned, nothing is patched; the heuristic gates DLSS.
; EngineSeam=1  scan the game module for UE 4.27's ITemporalUpscaler vtable, validate it against
;               three exact constants (GetDebugName returns the literal "FDefaultTemporalUpscaler";
;               the two fraction accessors decode to exactly 0.5 and 2.0), log the verdict, and
;               install NOTHING. Read-only; executes nothing it finds; cannot change a pixel.
; EngineSeam=2  additionally stand in for AddPasses (forwarding to the engine's own, so the image
;               is unchanged) and cross-check the heuristic matcher against what the engine
;               announces ("ENGINE SEAM DISAGREES"). The heuristic still gates DLSS.
; EngineSeam=3  AUTHORITATIVE (default since 2026-09-03, facts §36): DLSS SR runs ONLY on the
;               dispatch the engine's announcement fits. The cooked-hash table and the structural
;               signature are assertions ("ENGINE SEAM ASSERTION", once per pass), never gates.
;               A frame the engine announced nothing for runs no DLSS, and the refusal is named.
;
; The verdict is readable from the MAIN MENU (the seam fires on frame 0 and the menu runs the
; TAA pass): "ENGINE SEAM MODE: authoritative is ACTIVE", then "ENGINE SEAM AUTHORITATIVE: first
; announced pass claimed", then the periodic "[seam] frame N:" line - `unclaimed` must stay 0;
; `preSkipped` is EXPECTED to grow (the SSD passes ask every frame and are turned away before
; the descriptor resolve, by group count alone; `lookalikesRefused` counts the few that reach a
; claim).
EngineSeam=3
; EngineSeamFallback=1: at EngineSeam=3 with no live seam (the scan refused, or the patch
; failed), run the pre-seam heuristic instead - announced at ERROR level, never silently. 0
; refuses every dispatch instead, so DLSS is off rather than back on the heuristic.
EngineSeamFallback=1
; EngineSeamInputs=1 (L1): take DLSS SR's colour, depth and velocity from the engine's own
; FPassInputs - resolved INSIDE AddPasses via FRDGTexture -> FRHITexture -> GetNativeResource() -
; instead of inferring the roles from bound registers and the liveness from ReShade's
; view->resource map. A resource the engine is about to bind is alive by construction, which is
; what fixes the `unclaimed` frames that show up as NR guides-stale / frame-gap resets (the "DLSS
; flip"). The heuristic stays as an assertion (one WARN per session if they differ) and as a
; fallback that is COUNTED in the [seam] line's `l1:` group. Both offsets are CONFIRMED on this
; executable (facts §36.9: the first resolve returned all three pointers already known live to
; our own resource registry), and every resolved pointer must still be one the registry knows,
; so a wrong offset falls back rather than lying.
;
; L1 CRASHED THE GAME ONCE, at 3365f02, and the fix is worth knowing about before you touch this
; key. The offsets were right; the LIFETIME was not. The seam's ledger deliberately holds an
; announcement across up to 4 newer ones so a late dispatch still correlates - which is right for
; IDENTITY and fatal for POINTERS, because FRDGTexture comes from the frame's FRDGAllocator and
; the builder resets it at the end of Execute - and the D3D12 dispatch we intercept happens on
; ANOTHER THREAD, A FRAME LATER, after that free (UE 4.27 queues RHI commands and drains them on
; the RHI thread). So the chain walk now happens INSIDE AddPasses, on the render thread, where the
; builder is provably alive; the announcement carries plain ID3D12Resource* and the claim only
; checks them against our own registry. Depth and velocity are what resolve there (both are
; RegisterExternalTexture, which calls SetRHI immediately); colour is the post-chain texture and
; `rhi_null` for it is EXPECTED, not a failure.
;
; Two builds tried to fix this with a GATE on the claim instead - same-thread, then
; newest+same-frame - and both made L1 silently inert (stale=4147 of 4147, then resolved frozen at
; 164 while stale grew every frame). Neither could have worked: the memory is already freed
; whatever the gate says. `l1: stale=` survives as the RHI thread's LAG, not a refusal.
;
; The reads and the GetNativeResource call run under VirtualQuery + SEH, and the first fault
; turns L1 off for the session with one ERROR line naming the address.
;
; CONFIRMED ON THE BOX (facts §36.13): `partial` tracks `claimed` exactly, deadInputs=0,
; fellBack=0, faults=0. `resolved` stays 0 BY DESIGN because it counts all three including
; colour - `partial` is the success state here. Read `l1: partial=` against `claimed=`, plus
; `faults=` and `off=`. See docs/RESEARCH-ENGINE-TAA-HOOK.md §12.
;
; Set 0 to keep EngineSeam=3 but go back to the heuristic's inputs. Measured cost of doing so:
; deadInputs returns, and the heuristic's register walk is measurably WRONG about velocity on
; this title - L1's own assertion caught it naming a resource the engine never bound (§36.13.1).
EngineSeamInputs=1

; EngineSeamViewParams=2 (AUTHORITATIVE since 2026-09-04 - the engine's struct SUPPLIES the View
; once the offset has proven itself; set 1 to go back to discover-and-report, 0 to switch it off).
; The View constant buffer is located by SEARCH over every bound root CBV in slot order, and the
; search was measured taking a STALE RING COPY of this very view on 0.33% of claimed dispatches
; (facts §36.20): two candidates, BOTH the real 1920x1080 render rect for the SAME view, both
; passing plausibility, row 135 and the fit bound, differing only in ClipToPrevClip, jitter and
; CameraCut. UE4 sub-allocates the View CB from a constant ring and a previous frame's copy is
; still bound on a lower root parameter. No structural test can separate those - both genuinely
; ARE this view's uniform buffer and differ only in WHEN they were written.
;
; The engine has a CPU copy of the exact struct that buffer is created from:
; FViewInfo::CachedViewUniformShaderParameters (SceneRendering.h, right after ViewRect), a
; TUniquePtr the `const FViewInfo&` AddPasses already hands us. It is per-FViewInfo and rebuilt
; per frame, so it cannot be a stale ring copy. Its offset is DISCOVERED, never derived
; (sizeof(FSceneView) is unobservable from outside): inside every AddPasses a bounded window of
; the FViewInfo is scanned for a pointer whose pointee parses as a View, passes row 135, fits the
; engine's own output rect for that announcement from above and below, and carries L1's depth
; extent at row 132 - and then, AT CLAIM, is BYTE-IDENTICAL to what the search read from the
; bound constant buffer for the dispatch that claimed it. That last one is what latches the
; offset: it ties the candidate to a buffer the engine demonstrably bound. Two survivors on one
; announcement REFUSE to latch rather than pick by scan order.
;
; Levels: 1 discovers, compares and logs - the search still supplies the View. 2 makes the struct
; the source once latched, with the search as the assertion: a disagreement is then the search
; reading a stale copy (disagree= on the [viewParams] line) and ambClaimed reads 0 by
; construction. 3 (delete the search) is declared and NOT built - asking for it logs at ERROR and
; runs level 2. Guards are L1's: VirtualQuery before every read, SEH around it, a fault turns the
; mechanism off for the session at ERROR naming the address (faults= off=), and every decline is a
; counted fallback to the search (fellBack=). Windows-portable: nothing here touches vkd3d, DXVK
; or Wine, and no D3D12 resource is mapped - the pointee is ordinary heap memory.
;
; MEASURED ON THE BOX 2026-09-04 at level 1 (facts §36.22), which is why 2 is now the default:
; exactly ONE candidate offset, FViewInfo+5768, byte-IDENTICAL to the bound buffer on the first
; comparison, latched after 8 claimed announcements, faults=0 and no errors - and disagree=4
; matched the search's own ambClaimed=4 event for event, with every WARN naming jitter /
; PreExposure / ClipToPrevClip. That is facts §36.20's stale-ring shape, now attributed.
;
; Level 2 CANNOT act before it has proven itself: substitution requires the latch, and the latch
; requires 8 byte-exact agreements with a buffer the engine bound. On an executable where the
; offset moved, or where a reader refuses, no latch forms and the search supplies the View exactly
; as at level 0 - so the worst case of 2 is the behaviour of 1.
;
; TWO DEPENDENCIES, because deploy.sh writes only the keys it is passed and a stale one is
; invisible here. This only ever runs on a dispatch the ENGINE announced, so EngineSeam=3 is
; required - without it resolve_at_claim is never called and [viewParams] stays observed=0 with
; the latch stuck in `searching`. And prediction 5 (row 132 against the depth extent) needs
; EngineSeamInputs=1, which is what fills the announcement's depth resource; with it off the scan
; still works and simply says so on the first-scan line ("L1 resolved no depth, so row 132 was
; not tested"), one prediction lighter. Pass all three keys, every deploy.
;
; Read the [viewParams] line: latch=latched with an offset is the good outcome; ambiguous or
; absent is a round trip rather than a thing to keep running on, and the first-scan line's
; per-stage candidate counts say which prediction refused. This supersedes the two-offset design
; of docs/RESEARCH-ENGINE-TAA-HOOK.md §15 (branch view-cb-identity, key EngineSeamView, never
; merged). docs/RESEARCH-ENGINE-AWARE-REPLAN.md §2, src/core/view_cached.hpp.
EngineSeamViewParams=2

; --- The engine's own route to the TAA output UAV u0 (src/u0_rhi_hook.hpp) ---
; docs/RESEARCH-U0-IDENTITY.md concluded u0 had no engine route, having checked both ENDS of the
; window in which RDG assigns it. The MIDDLE was unexamined: on the RHI thread the pass binds
; every parameter through IRHIComputeContext virtuals with the register as an argument -
; RHISetUAVParameter(shader, 0, uav) for u0 - right before the D3D12 Dispatch we intercept.
;
; U0Hook=0  off.
; U0Hook=1  DISCOVER: take the Dispatch hook's own return address (inside
;           FD3D12CommandContext::RHIDispatchComputeShader), resolve it through the exe's .pdata
;           to a function start, find the read-only qword holding it (IRHIComputeContext slot 3),
;           and hold the vtable to six predicted empty-body slots. Log the verdict; install
;           NOTHING. The default until the box has judged level 2.
; U0Hook=2  OBSERVE: install forwarding thunks on RHISetComputeShader and slots 14..19 (the
;           window around the two RHISetUAVParameter overloads - MSVC reverses adjacent
;           overloads, so which slot is which is MEASURED, not counted), classify each slot by
;           the objects it is handed, resolve the UAVIndex==0 bind's object to an ID3D12Resource
;           by scanning it for a CPU descriptor handle our own CreateUnorderedAccessView hook
;           recorded, and on every engine-announced dispatch ASSERT it against the descriptor
;           walk's u0. The walk stays authoritative; read the [u0] line: `assert: disagree=`
;           must stay 0, `noBind=` non-zero means the slot is wrong on this exe.
; U0Hook=3  declared, not implemented (treated as 2 with a WARN).
U0Hook=1

; --- DLSS Neural Rendering, NGX feature 18 (src/nr_hook.hpp) ---
; Since 2026-09-03 NR runs as a PRESENT STAGE over the back buffer and has no other site. The
; image is display-referred there, so there is no HDR colour codec and no exposure term: the keys
; NgxNRPaperWhiteScale / NgxNRColorStrength / NgxNRTransferStrength / NgxNRTrackExposure /
; NgxNRSmoothExposure / NgxNRExposureSmoothing / NgxNRScaleResetTolerance / NgxNRRestoreHistory /
; NgxNRRestoreState / NgxNRHook / NgxNRTopology no longer exist and are ignored if present.
NgxNR=1
NgxNRIdentity=nvngx
NgxNRWarmupFrames=60
NgxNRPreset=1
NgxNRIntensity=1
NgxNRLocalTone=1.05
NgxNRLocalStructure=1.61
NgxNRSkinStructure=2
NgxNRAutoMask=1
NgxNRUICorrection=1
NgxNRMVecScale=0
; --- DLSS Frame Generation (plugin host only; src/backend_native/fg_present.hpp, facts §32) ---
; NgxFG=1 hands the game replacement back buffers and presents twice per game frame.
; NgxFGMode: 1 = stage-1 experiment (the generated frame is the previous real frame with a
;            magenta band; no NGX), 2 = DLSS-G through NGX feature 11 (stage 2).
; NgxFGPacing: 1 = worker thread (generated now, real after half the game's frame interval),
;              0 = both presents back to back on the game thread (the bimodal control),
;              2 = both on the game thread, NgxFGWaitMs apart (no second thread; bisection).
; NgxFGWaitMs: -1 = the pacer's half interval; >= 0 fixes the delay.
; NgxFGValidate: 1 = ngx-mode output reaches the screen only after the crop readback passes.
NgxFG=0
NgxFGMode=2
NgxFGPacing=1
NgxFGWaitMs=-1
NgxFGBand=1
NgxFGValidate=1
; NgxFGReflex: 0 off, 1 low-latency mode + Sleep per game present + latency markers, 2 = 1 + boost.
NgxFGReflex=1
; --- the flip-queue throttle (src/core/fg_throttle.hpp; ALL THREE DEFAULT OFF) ---
; The pacer decides WHEN we issue our two presents; nothing bounded how far the PRESENT QUEUE
; then ran ahead of the display. "issued-interval ... BIMODAL (back-to-back presents)" in the
; [fg] line is that symptom. Streamline's sl.dlss_g bounds it with SetMaximumFrameLatency +
; GetFrameLatencyWaitableObject + a bounded wait before presenting; this is the same thing.
;
; NgxFGWaitableSwapChain=1 adds DXGI_SWAP_CHAIN_FLAG_FRAME_LATENCY_WAITABLE_OBJECT to the desc
;   the GAME hands DXGI - the waitable object cannot be added after creation, so the throttle is
;   inert without it (it then refuses with `not-waitable`, loudly). On its own the flag changes
;   no presentation behaviour: vkd3d-proton only creates a latency semaphore nothing consults
;   unless someone waits. Re-asserted on every ResizeBuffers, which MSDN allows to reset flags.
; NgxFGThrottle=1 makes each present we issue wait for a flip slot FIRST, before the pacer's own
;   deadline. The two are max(), never a sum, so it cannot double-delay a present.
; NgxFGMaxLatency: flip slots allowed outstanding. Our pair is two presents per game frame, so 2
;   bounds the queue at one pair; 1 would serialise the pair against the display. 0 = leave the
;   swapchain's own value (vkd3d-proton starts a waitable chain at 1, which is too tight).
; NgxFGThrottleTimeoutMs: bound on ONE wait. NgxFGThrottleGiveUp: consecutive timeouts after
;   which the throttle disarms itself for the session, loudly, rather than blocking forever
;   (0 = never give up). Both exist so an overnight run cannot wedge on a stalled display.
NgxFGWaitableSwapChain=0
NgxFGThrottle=0
NgxFGMaxLatency=2
NgxFGThrottleTimeoutMs=50
NgxFGThrottleGiveUp=8
; NgxFGOutOfBandQueue: NvAPI_D3D12_NotifyOutOfBandCommandQueue on the present owner's queue.
; 0 off, 1 = OUT_OF_BAND_PRESENT (the type that matches our generated presents), 3 =
; OUT_OF_BAND_RENDER_PRESENT. Streamline makes this call and we do not; DXVK-NVAPI implements it
; for real. HARD that they call it, UNCONFIRMED that omitting it has ANY consequence - adopt it
; as tidiness with a plausible latency-accounting benefit, never as a fix.
NgxFGOutOfBandQueue=0
; DLSS-G feature knobs (src/ngx_fg.hpp): NgxFGHDR -1 auto (R10G10B10A2 => HDR10) / 0 / 1;
; NgxFGWarmupFrames presents before the first CreateFeature;
; NgxFGMvecScale 1 = pixels -> SL's 1/renderWidth convention, 2 = 1.0 (A/B);
; NgxFGOutputReal 1 = also hand the snippet a DLSSG.OutputReal texture.
;
; NgxFGCameraNear / NgxFGCameraFar are NVIDIA's own synthetic pair, sent by their Streamline
; plugin on BOTH engine generations and documented there as not needing to match the engine.
; These lines used to read `NgxFGCameraFar=0` on the theory that 0 says "infinite far plane",
; which is what Stray's reversed-Z infinite projection means. That was our invention:
; sl_consts.h makes the pair non-optional with INVALID_FLOAT as the unset sentinel, so 0 is a
; degenerate near-zero depth RANGE and DLSS-G's camera reconstruction divides by it. Set
; NgxFGCameraNear=0 to go back to the measured View.NearPlane (row 142.x); set
; NgxFGCameraFar=0 to reproduce the old behaviour exactly.
NgxFGHDR=-1
NgxFGWarmupFrames=60
NgxFGCameraNear=0.01
NgxFGCameraFar=75000
NgxFGMvecScale=1
NgxFGOutputReal=1
; Diagnostic, default 0: names who calls IDXGIAdapter3::QueryVideoMemoryInfo and times it.
VramQueryWatch=0
; Periodic diagnostic file writes, each individually toggleable. Both default ON (identical
; behaviour to before these switches existed). Turn one off when chasing a periodic hitch, to
; rule a given write in or out without disabling the feature it belongs to.
; StatusFile: the stray-dlss-status.txt heartbeat (frame/census/dispatch counters), rewritten
;   every StatusFileFrames presents (default 30, i.e. ~1.6 Hz at the user's frame rate).
;   Raising StatusFileFrames instead of disabling keeps the heartbeat available but rarer.
; StageFile: the stray-dlss-stage.txt crash breadcrumb, SIX writes per intercepted TAA
;   dispatch (taa_hook.cpp's mark()). Default OFF: it was written to name the Phase B access
;   violation, which is closed, and it is synchronous file I/O on the render thread. Turn it
;   on deliberately when a new crash needs its step named.
StatusFile=1
StatusFileFrames=30
StageFile=0

; ---------------------------------------------------------------------------------------------
; KEYS THE PLUGIN READS THAT THIS FILE DID NOT LIST (added 2026-09-04).
;
; They are commented out ON PURPOSE: each one's built-in default is a variable in the source, not
; a literal, so writing a value here would be asserting a default I have not verified - and a
; wrong default in this file is worse than a missing one, because the deploy trap is "pass every
; key, every time" and whatever is written here is what gets passed. Uncomment to override; leave
; commented to keep the built-in.
;
; The point of listing them is discoverability: a key nobody knows exists cannot be passed, and
; cannot be ruled out when a run behaves oddly.
;
;PerfLog=                    ; the periodic fps / worst-frame / CPU-share report
;StallWatch=                 ; default true - watches for stalls around the evaluate
;ShadowMode=                 ; descriptor-shadow strategy (string)
;PassFinder=                 ; the heuristic TAA pass finder, superseded by the engine seam
;NgxFGTrace=                 ; default 0 - per-present frame-generation trace, very verbose
;NgxNRPreload=               ; LoadLibrary the NR snippet at device init (no GPU contact)
;NgxNRStyle=                 ; DLSSNR.Style, a small integer with no weight switch behind it
;NgxNRDll=                   ; path override for nvngx_dlssnr.dll
;NgxNRStageBackBufferState=  ; assumed D3D12 state of the back buffer at the NR present stage
;NgxSnippetPath=             ; path override for the NGX snippet
