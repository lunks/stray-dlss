; StrayDualSense — optional configuration.
;
; Every value here is already the default, so an absent file behaves identically. Put this
; next to the mod DLL, or in the game's Binaries/Win64 directory.
;
; Most keys are HOT-RELOADED (re-read every ConfigReloadSeconds, no relaunch). The exceptions
; are PadUserId, SpeakerDeviceMatch, VibeDir and SpkDir, which are read once at startup by
; threads that are already running — changing those is logged as a warning and ignored.

[StrayDualSense]
Enabled = 1
; Debug | Info | Warn | Error.  Debug logs every trigger event and is noisy.
LogLevel = Info

; 0 = probe user slots 1..4 and adopt the one whose `connected` byte is set. MEASURED: all
; four slots hand back a positive handle AND a success code, so anything but the connected
; byte is a guess. Set 1..4 only to force a slot, which skips the probe.
PadUserId = 0
PadPollSeconds = 2.0

; --- adaptive triggers -----------------------------------------------------------------
Triggers = 1
; GAME-AUTHORED values, read from HKPlayerController.m_scratchablePS5TriggerEffect (+0x730):
; FEEDBACK{position 0, strength 2}. `2/8` was an early guess and feels like a hard block.
TriggerPosition = 0
TriggerStrength = 2
; Diagnostic hardware readback after each change; costs a 120 ms sleep on the worker thread.
TriggerReadback = 0

; --- haptics ---------------------------------------------------------------------------
Haptics = 1
; 0..255. 255 = unity, which is the faithful value: the game's vibration chain is unity gain
; end to end and the envelopes were generated with one shared scale across the whole set.
HapticGain = 255
EnvelopeStepMs = 5
MaxEnvelopeSteps = 12000
; The working Lua mod looped EVERY vibration and relied on StopPS5Vibration. Ported as-is.
HapticLoop = 1

; --- controller speaker ------------------------------------------------------------------
Speaker = 1
; SBFX_Boost = InputGainDb +5.0 dB, Ratio 1:1 -> a level trim. 10^(5/20) = 1.7783.
SpeakerBoost = 1.7783
SpeakerDeviceMatch = DualSense
SpeakerAssetRate = 48000
SpeakerLoop = 1

; --- assets ------------------------------------------------------------------------------
; Relative to the game's Binaries/Win64 directory first, the mod directory second.
VibeDir = vibe
SpkDir = spk

; --- diagnostics -------------------------------------------------------------------------
HookRetrySeconds = 3.0
StatusSeconds = 30.0
ConfigReloadSeconds = 5.0
