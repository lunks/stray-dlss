; StrayDualSense — optional configuration.
;
; Every value here is already the default, so an absent file behaves identically. Put this
; next to the mod DLL, in the mod root, or in the game's Binaries/Win64 directory.
;
; There are deliberately few knobs. The plugin is a thin shim: the engine mixes, fades, loops
; and levels the pad's haptics and speaker audio into two submixes of its own; the plugin makes
; those submixes render on PC, taps them, moves the samples onto the pad's endpoint (coils on
; RL/RR, speaker on FL/FR), and asks Sony's own libScePad to route the pad's speaker and to
; drive the adaptive triggers with the effect the game authored.
;
; Scalars are HOT-RELOADED (re-read every ConfigReloadSeconds). PadUserId, EndpointMatch and
; the submix paths/slots are read once at startup; changing them is logged as a warning and
; ignored until relaunch. Keys from before 0.4.0 (HapticSource, SubmixReroute, ForcePS5HapticPath,
; PadSpeakerRoute, PadSpeakerHid*, HapticDir, SpkDir, *LoopsFile) are logged as retired and ignored.

[StrayDualSense]
Enabled = 1
; Debug | Info | Warn | Error.  Debug logs every per-component stop and HID write.
LogLevel = Info

; 0 = probe user slots 1..4 and adopt the one whose `connected` byte is set. MEASURED: all
; four slots hand back a positive handle AND a success code, so anything but the connected
; byte is a guess. Set 1..4 only to force a slot, which skips the probe.
PadUserId = 0
PadPollSeconds = 2.0

; --- adaptive triggers -----------------------------------------------------------------
Triggers = 1
; Diagnostic hardware readback after each change; costs a 120 ms sleep on the worker thread.
; The first engage after open always reads 0/0 — never judge on one sample.
TriggerReadback = 0

; --- the coils: the mode byte --------------------------------------------------------------
Haptics = 1
; DualSense USB output report 0x02, byte 1 = valid_flag0. The bits are VALIDITY CLAIMS, not a
; mode. 0x00 claims nothing, and thereby stops re-asserting COMPATIBLE_VIBRATION (bit0), which
; is all it takes for the coils to take the waveform. Do NOT use 0xFC: it claims the trigger
; fields while supplying zeros, which kills and then latches the adaptive triggers. 0x01
; hands the coils back to rumble emulation (what the plugin writes on shutdown).
HapticValidFlag0 = 0x00
; libScePad's own reports carry the same byte and undo one write; re-assert on this cadence
; (and, always, on the coil lane's silence -> signal edge).
HapticReassertSeconds = 2.0
; Applied to the coil lane before the soft clip. The engine has already applied the level the
; game asked for (SetPS5VibrationLevel runs upstream of the tap).
SubmixGain = 1.0

; --- the speaker -----------------------------------------------------------------------------
; The speaker comes from the engine's own Submix_controllerMaster through the tap, onto FL/FR of
; the same stream that carries the coils. Speaker = 0 silences that lane (a gain, so the tap
; keeps reporting) and stops selecting the pad's speaker route below.
Speaker = 1
; Applied to the speaker lane before the soft clip. 1.0 on purpose: the engine's own chain has
; already applied SBFX_Boost (+5 dB); the retired asset path baked that trim in as a constant
; because it BYPASSED the chain, and carrying it here would apply it twice. A knob for A/B only.
SpeakerGain = 1.0
; THE PAD'S OWN ROUTING. Its default routing MUTES the internal speaker, so the samples above
; reach nothing until Sony's scePadSetAudioOutPath selects it — exactly what the retired
; libScePad shim did when the speaker last worked, and user-confirmed on the pad from the plugin.
; ScePadAudioOutPath, BY VALUE: 0 STEREO_HEADSET, 1 MONO_HEADSET, 2 MONO_HEADSET_SPEAKER,
; 3 SPEAKER, 4 OFF.
PadSpeakerPath = 3
; ScePadVolumeGain { u8 SpeakerVol, JackVol, Reserved, MicGain }; the shim passed 80 for the
; first two. 0..255.
PadSpeakerGain = 80
; Re-apply the routing on this cadence as well as on change. 0 = only on change, which is what
; the shim did. Whether libScePad's own reports ever reset the audio path is UNCONFIRMED.
PadSpeakerReassertSeconds = 0

; --- the two submixes, and the reroute that makes the engine render them -------------------
; By the paths measured in ue4ss/UE4SS_ObjectDump.txt. Both roots are EndpointSubmixes with no
; factory on Windows, so UE 4.27 hands them a dummy endpoint and never renders either subtree
; (docs/STRAY-DUALSENSE.md §14/§16). The reroute re-parents both masters under
; SubmixRerouteParent (rendered every callback), with that parent's OutputVolume set to 0 so
; nothing leaks into the speakers, and asks the engine to rebuild the links through
; FAudioDevice::RegisterSoundSubmix (vtable slot SubmixRegisterSoundSubmixSlot; measured working
; at 14). Listeners run after the submix's own volume (1.0) and before the parent's (0), so the
; taps see the full mix. Always on: without it there is nothing to tap.
SubmixPath = /Game/Sound/tools/settings/Submix_vibrationMaster.Submix_vibrationMaster
SubmixSpeakerPath = /Game/Sound/tools/settings/Submix_controllerMaster.Submix_controllerMaster
SubmixRerouteParent = /Game/Sound/tools/settings/Submix_unused.Submix_unused
SubmixRegisterSoundSubmixSlot = 14

; WHERE THE LISTENERS GO - and this is NOT what the reroute re-parents above.
;
; MEASURED IN THE GAME 2026-09-03 (docs/STRAY-DUALSENSE.md §20.1). With both listeners on the two
; masters, the masters are SIBLINGS under one SubmixRerouteParent - and UE 4.27 hands a buffer
; listener the PARENT's accumulation buffer (AudioMixerSubmix.cpp:1364, :1380), zeroed once per
; callback rather than once per child. So the second sibling the engine processes reads BOTH
; lanes. The tell was in our own numbers: over 2,483 non-silent status periods the two lanes'
; peak AND rms were bit-identical in 2,365 of them (95.2%), and every _VIBE the engine mixed was
; emitted on the pad SPEAKER as well as the coils.
;
; Tapping each master's own CHILD removes the sharing instead of compensating for it: the buffer
; a child's listener gets is its master's own accumulation, which holds that master's subtree and
; nothing else. What it gives up is the master's own OutputVolume and effect chain - both
; measured unity/empty on this title, so today it is exactly a no-op. SBFX_Boost is unaffected:
; it lives BELOW Submix_controller, not on the master.
;
; LEAVE EMPTY to tap the master instead, which is the pre-0.4.1 arrangement and ALIASES. That is
; deliberate: it is the A/B that proves the fix inside one session with no rebuild, and the
; 'alias' field on the SUBMIX line reports a completely different number in the two modes.
SubmixTapPath = /Game/Sound/tools/settings/Submix_vibration.Submix_vibration
SubmixSpeakerTapPath = /Game/Sound/tools/settings/Submix_controller.Submix_controller

; FAudioDevice::RegisterSubmixBufferListener's vtable index. 16 for stock UE 4.27.2, measured
; working. Stray is a LICENSEE build; the log dumps the vtable so a wrong value is fixable in
; one run. See mods/StrayDualSense/src/SubmixDiscovery.hpp.
SubmixRegisterSlot = 16

; both | world | engine. Which objects may supply the FAudioDevice pointer; the ladder decides.
; MEASURED: UWorld holds no audio device on this build, UEngine does (MainAudioDeviceHandle).
SubmixDeviceSource = both
; How far into UWorld/UEngine to scan. 0x2000 was NOT ENOUGH (measured 2026-09-03): UEngine
; declares 268 UPROPERTYs before MainAudioDeviceHandle, so it sits thousands of bytes in.
SubmixScanBytes = 32768
; Words of each non-UObject candidate to dump when NOTHING is accepted.
SubmixDumpWords = 96

; A second, meter-only listener on the master submix, never connected to the pad. It turns a
; null result into a DIAGNOSIS: master firing while a lane stays silent means the tap works and
; the engine is not rendering that subtree; neither firing means the tap is broken.
SubmixProbeMaster = 1

SubmixQueueAheadMs = 40    ; WASAPI lead on the pad stream; raise it if the pad crackles
SubmixRingMs = 250         ; per-lane ring capacity; ~12 engine callbacks at UE's 1024-frame default
SubmixStatusSeconds = 1.0

; THE CORRELATION INSTRUMENT. Every StartPS5Vibration opens the coil lane's watch and every
; StartPS5ControllerSound the speaker lane's, this many seconds wide; when it closes, ONE line
; names the asset and says what the engine put in that submix for it (NoData / Silent / Mixed).
; The per-second peak alone cannot answer that — it reads 0.00000 whenever nothing happens to
; be playing. 0 disables the watches.
SubmixWatchSeconds = 3.0

; What counts as a REAL SIGNAL: the peak at or above which a lane is called live and the sink
; opens. 1e-4 is -80 dBFS, deliberately low so a quiet asset is not missed. A real VIBE asset
; measures around 0.7 (docs/STRAY-DUALSENSE.md §14); if the log's "FIRST REAL SIGNAL" peak is a
; small fraction of that, raise this instead of believing it.
SubmixLiveThreshold = 0.0001

; How often the WARN repeats while a lane is enabled and its submix is not delivering. 0
; disables the cadence; the COILS: / SPEAKER: lines still say who drives each pair.
SubmixWarnSeconds = 10

; THE REROUTE WATCHDOG. MEASURED 2026-09-03: a LEVEL LOAD rebuilds the submix graph and drops the
; re-parenting (BaseMap peak 0.708, then zero callbacks in 03_Slums for the whole session). If a
; bound lane's callbacks stop advancing for this long after having advanced at least once, the
; reroute is re-submitted for the parent and both masters (the listeners are NOT re-registered -
; UE appends without de-duplicating). 0 disables it.
SubmixRerouteWatchdogSeconds = 5.0

; One line per lane, rewritten in place next to the log, so the numbers can be read with `cat`.
SubmixStatusFile = stray-dualsense-submix.txt

; --- button glyphs -----------------------------------------------------------------------
; ps5 | ps4 | xbox | game. The pad is presented to the game as an X360 device (Steam Input),
; so the game draws Xbox prompts; a post-hook on InputSubsystem:GetGameControllerType rewrites
; the answer (EGameControllerType: 1 XBOX, 2 PS4, 3 PS5). "game" leaves the game's own answer.
Glyphs = ps5

; --- the pad's WASAPI endpoint -----------------------------------------------------------
; Substring of the friendly name. MEASURED: "Speakers (DualSense Wireless Controller)",
; 4ch / 48000 Hz / 32-bit float, FL FR = speaker, RL RR = the two coils.
EndpointMatch = DualSense

; --- diagnostics -------------------------------------------------------------------------
HookRetrySeconds = 3.0
StatusSeconds = 30.0
ConfigReloadSeconds = 5.0
