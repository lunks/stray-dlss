; StrayDualSense — optional configuration.
;
; Every value here is already the default, so an absent file behaves identically. Put this
; next to the mod DLL, or in the game's Binaries/Win64 directory.
;
; There are deliberately few knobs. The trigger effect is read from the game
; (HKPlayerController.m_scratchablePS5TriggerEffect), loops come from the assets' own
; bLooping flag (haptic_loops.txt / spk_loops.txt), the speaker's +5 dB SBFX_Boost trim is a
; constant in the code, and the haptic waveforms play at the level the game asks for.
;
; Scalars are HOT-RELOADED (re-read every ConfigReloadSeconds). PadUserId, EndpointMatch and
; the paths are read once at startup by threads already running; changing them is logged as
; a warning and ignored until relaunch.

[StrayDualSense]
Enabled = 1
; Debug | Info | Warn | Error.  Debug logs every ignored per-component stop and HID write.
LogLevel = Info

; 0 = probe user slots 1..4 and adopt the one whose `connected` byte is set. MEASURED: all
; four slots hand back a positive handle AND a success code, so anything but the connected
; byte is a guess. Set 1..4 only to force a slot, which skips the probe.
PadUserId = 0
PadPollSeconds = 2.0

; --- adaptive triggers -----------------------------------------------------------------
Triggers = 1
; Diagnostic hardware readback after each change; costs a 120 ms sleep on the worker thread.
; The first engage after open always reads 0/0 — never judge on one sample.
TriggerReadback = 0

; --- haptics: the game's VIBE waveforms on the two voice coils ----------------------------
Haptics = 1
; DualSense USB output report 0x02, byte 1 = valid_flag0. The bits are VALIDITY CLAIMS, not a
; mode. 0x00 claims nothing, and thereby stops re-asserting COMPATIBLE_VIBRATION (bit0), which
; is all it takes for the coils to take the waveform. Do NOT use 0xFC: it claims the trigger
; fields while supplying zeros, which kills and then latches the adaptive triggers. 0x01
; hands the coils back to rumble emulation (what the plugin writes on shutdown).
HapticValidFlag0 = 0x00
; libScePad's own reports carry the same byte and undo one write; re-assert on this cadence
; (and, always, immediately before each waveform).
HapticReassertSeconds = 2.0

; --- the SUBMIX SPIKE: take the haptics from the engine's own mix ------------------------
;
; Read mods/StrayDualSense/README.md, "The submix spike", and docs/STRAY-DUALSENSE.md §14
; before turning it on. Every status line begins with WHO DRIVES THE COILS ("COILS: ...");
; read that, never `bound=`.
;
;   assets           the shipped behaviour. No listener is created; nothing below applies.
;   measure          register the listener and REPORT NUMBERS; the asset path still drives
;                    the coils. Answers "is the engine mixing haptics for us" without risking
;                    the pad. THE SAFE DIAGNOSTIC CONFIGURATION.
;   submix-fallback  the asset path drives the coils UNTIL the tap carries a real signal, then
;                    the submix takes over. The log WARNS every SubmixWarnSeconds while the
;                    fallback is in charge: what you feel before the handover is NOT the submix.
;   submix           STRICT: the submix or nothing. The asset haptic path never plays, so
;                    anything you feel came from the submix. A silent submix is a silent pad,
;                    and the log says so on a cadence.
;
; MEASURED 2026-09-03: on PC the vibration subtree is NEVER rendered - its root is an
; EndpointSubmix of type "Vibration Output", which has no factory on Windows, so the engine
; gives it a dummy endpoint and skips the whole subtree (UE 4.27 AudioMixerSubmix.cpp,
; ProcessAudioAndSendToEndpoint). A plain tap on it reports zero callbacks forever. See
; SubmixReroute below for the way round it.
HapticSource = assets

; How often the WARN repeats while a submix mode is configured and the submix is not
; delivering. 0 disables the cadence; the COILS: line still says who drives the coils.
SubmixWarnSeconds = 10

; --- the REROUTE: make the engine render the vibration submix on PC ----------------------
; Re-parents SubmixRerouteMaster (Submix_vibrationMaster) under SubmixRerouteParent, a submix
; that IS rendered every callback, after setting the parent's OutputVolume to 0 so nothing
; leaks into the speakers; then asks the engine to rebuild the links through
; FAudioDevice::RegisterSoundSubmix (vtable slot SubmixRegisterSoundSubmixSlot, 14 for stock
; UE 4.27.2 - two below the listener slot). The tap on Submix_vibrationMaster then sees the
; full mix: listeners run after the submix's own volume (1.0) and before the parent's (0).
; SILENT callbacks at ~47/s are the proof the subtree renders; a real signal needs a haptic.
SubmixReroute = 0
SubmixRerouteMaster = /Game/Sound/tools/settings/Submix_vibrationMaster.Submix_vibrationMaster
SubmixRerouteParent = /Game/Sound/tools/settings/Submix_unused.Submix_unused
SubmixRegisterSoundSubmixSlot = 14

; BP_HKPlayerController_C.DebugPS5Haptic - MEASURED 2026-09-03: the PS5 haptic Blueprints do
; nothing on PC until this bool is true; with it, StartPS5Vibration plays the _VIBE asset on
; the ControllerVibration AudioComponent (routed to Submix_vibration by its sound class).
; The plugin sets it from its own Start hooks, before the Blueprint's gate runs.
ForcePS5HapticPath = 0

; The submix to listen on, by the path measured in ue4ss/UE4SS_ObjectDump.txt. The literal
; "master" registers on the engine's MASTER submix instead - a null submix is UE's own
; shorthand for it - which needs no USoundSubmix object and is the surest proof that the tap
; MECHANISM works when the vibration submix reads silent.
SubmixPath = /Game/Sound/tools/settings/Submix_vibrationMaster.Submix_vibrationMaster

; A second, meter-only listener on the master submix, never connected to the coils. It turns a
; null result into a DIAGNOSIS: master firing while the vibration submix stays silent means the
; tap works and the game is not playing haptics into it; neither firing means the tap is broken.
SubmixProbeMaster = 1

; FAudioDevice::RegisterSubmixBufferListener's vtable index. 16 for stock UE 4.27.2, derived by
; counting virtuals in AudioDevice.h - and unusually safe, because not one FAudioDevice virtual
; sits inside a preprocessor conditional, so the vtable is identical in every build config.
; Stray is a LICENSEE build; the log dumps the vtable so a wrong value is fixable in one run.
; See mods/StrayDualSense/src/SubmixDiscovery.hpp.
SubmixRegisterSlot = 16

; both | world | engine. Which objects may supply the FAudioDevice pointer. MEASURED 2026-09-02:
; demanding the SAME POINTER in both objects was wrong twice over - the scan found 8 candidates
; in UWorld and 3 in UEngine with none shared, and a world audio device and the main audio
; device are ALLOWED to be different instances. The cross-check is now a shared VTABLE (both are
; FMixerDevice), and UEngine::MainAudioDeviceHandle is accepted on its own when the audio device
; manager sits immediately before it. "both" simply means "look in both"; the ladder decides.
SubmixDeviceSource = both

; How far into UWorld/UEngine to scan. 0x2000 was NOT ENOUGH (measured 2026-09-03): UEngine
; declares 268 UPROPERTYs before MainAudioDeviceHandle, so it sits thousands of bytes in.
SubmixScanBytes = 32768
; Words of each non-UObject candidate to dump when NOTHING is accepted. The sample-rate test is
; the one check that cannot self-check, so a refusal must leave enough behind to measure it.
SubmixDumpWords = 96

SubmixGain = 1.0
SubmixQueueAheadMs = 40    ; WASAPI lead on the coil stream; raise it if the coils crackle
SubmixRingMs = 250         ; ~12 engine callbacks at UE's 1024-frame default
SubmixStatusSeconds = 1.0

; THE CORRELATION INSTRUMENT. Every StartPS5Vibration opens a watch this many seconds wide;
; when it closes, ONE line names the asset and says whether the engine put anything in the
; submix for it. Without it the only reading is the per-second peak, which is 0.00000 whenever
; nothing is playing - and on 2026-09-03 exactly one such line was read as "the submix delivers
; nothing" on a session that had already handed the coils over on a real signal. 0 disables it.
SubmixWatchSeconds = 3.0

; What counts as a REAL SIGNAL: the peak at or above which the submix takes the coils over from
; the asset path. 1e-4 is -80 dBFS, deliberately low so a quiet asset is not missed. The cost:
; in strict HapticSource=submix the handover disables the asset path for the rest of the
; session, so one -80 dBFS tail is enough to report live=1 on a pad that feels silent. A real
; VIBE asset measures around 0.7 (docs/STRAY-DUALSENSE.md §14, run A); if the log's
; "FIRST REAL SIGNAL" peak is a small fraction of that, raise this instead of believing it.
SubmixLiveThreshold = 0.0001
; One line, rewritten in place next to the log, so the numbers can be read with `cat` over ssh.
SubmixStatusFile = stray-dualsense-submix.txt

; --- controller speaker ------------------------------------------------------------------
Speaker = 1

; WHICH MECHANISM SELECTS THE PAD'S AUDIO ROUTING.
;
; MEASURED 2026-09-03: the coils were driven from the engine's own submix (peak 0.708) while
; the pad's SPEAKER stayed silent from the same purr - with the speaker asset loaded, the pad's
; audio endpoint open, zero failures and megabytes of PCM streamed. Correct samples were
; reaching the pad and the pad was routing them nowhere, because ITS DEFAULT ROUTING MUTES THE
; INTERNAL SPEAKER.
;
; THE REGRESSION: our retired libScePad shim called scePadSetAudioOutPath(3=SPEAKER) and
; scePadSetVolumeGain(80) (tools/dualsense/libScePad_shim.c:476-502) and the speaker worked.
; deploy-submix-spike.sh retires the shim - correctly, two writers of valid_flag0 is the §12
; trap - and nothing has called those functions since.
;
;   sony   scePadSetAudioOutPath / scePadSetVolumeGain, resolved out of the libScePad the game
;          has ALREADY mapped, called with the handle scePadGetHandle already gives us. No
;          proxy DLL, no rename: Sony's dll stays the single writer of pad output reports.
;   hid    the raw USB output-report claim (valid_flag0 bit5|bit7 + audio_control's path
;          field). The fallback for a libScePad that refuses; see src/PadAudio.hpp.
;   both   sony, then hid unconditionally.
;   auto   sony, escalating to hid ONLY if Sony's call failed. THE DEFAULT: the HID claim's
;          coil safety is argued (a disjoint bit set, and ComposeValidFlag0 masks bits 0..3
;          out of it) rather than measured, so it runs only where the measured path is already
;          broken.
;   off    write nothing. This is the configuration in which the speaker is silent.
;
; If the coils ever stop working after this lands, set PadSpeakerRoute=sony (never touches a
; HID byte) or off, and say so - that would be the first evidence against the claim's safety.
PadSpeakerRoute = auto

; ScePadAudioOutPath, BY VALUE: 0 STEREO_HEADSET, 1 MONO_HEADSET, 2 MONO_HEADSET_SPEAKER,
; 3 SPEAKER, 4 OFF. 3 is the shim's measured-working value on this hardware. This is SONY's
; enum and has nothing to do with PadSpeakerHidPath below.
PadSpeakerPath = 3
; ScePadVolumeGain { u8 SpeakerVol, JackVol, Reserved, MicGain }; the shim passed 80 for the
; first two. 0..255.
PadSpeakerGain = 80
; Re-apply the routing on this cadence as well as on change. 0 = only on change, which is what
; the shim did. Whether libScePad's own reports ever reset the audio path is UNCONFIRMED.
PadSpeakerReassertSeconds = 0

; --- the HID fallback's own values (PadSpeakerRoute = hid/both, or auto after a refusal) ----
; These are the LINUX KERNEL's audio_control OUTPUT_PATH_SEL numbering (drivers/hid/
; hid-playstation.c), NOT Sony's:
;   0 HP=L/R speaker MUTED (the pad's default)   1 HP=L/L speaker MUTED
;   2 HP=L/L speaker=R                           3 HP muted, speaker=R
; 2 is the default because it feeds the speaker exactly as 3 does while leaving the headphone
; sinks alive - the kernel picks 3 only because it can detect that no headphones are plugged
; in, which we cannot. NOTE the internal speaker is fed from the RIGHT channel in every path;
; the speaker route writes the mono asset into both FL and FR, so do not "optimise" it to FL.
PadSpeakerHidPath = 2
; The pad's hardware speaker volume. The kernel's comment: accepted range [0x3d..0x64].
PadSpeakerHidVolume = 0x64
; Speaker preamp gain, 3 bits. The kernel uses 2 (+6 dB).
PadSpeakerHidPreamp = 2

; --- button glyphs -----------------------------------------------------------------------
; ps5 | ps4 | xbox | game. The pad is presented to the game as an X360 device (Steam Input),
; so the game draws Xbox prompts; a post-hook on InputSubsystem:GetGameControllerType rewrites
; the answer (EGameControllerType: 1 XBOX, 2 PS4, 3 PS5). "game" leaves the game's own answer.
Glyphs = ps5

; --- the pad's WASAPI endpoint -----------------------------------------------------------
; Substring of the friendly name. MEASURED: "Speakers (DualSense Wireless Controller)".
EndpointMatch = DualSense

; --- assets ------------------------------------------------------------------------------
; Relative to the game's Binaries/Win64 directory first, the mod directory second.
; haptic/<name>.f32  stereo float32 @ 48 kHz (left channel = left grip coil)
; spk/<name>.f32     mono float32 @ 48 kHz
HapticDir = haptic
SpkDir = spk
; The game's own bLooping flags, one asset name per line (tools/dualsense/wavegen.sh).
HapticLoopsFile = haptic_loops.txt
SpkLoopsFile = spk_loops.txt

; --- diagnostics -------------------------------------------------------------------------
HookRetrySeconds = 3.0
StatusSeconds = 30.0
ConfigReloadSeconds = 5.0
